  taskTableRows.push(Object.assign(["UKUPNO (radni sati)", minutesToHM(workedTotal)], {_bold:true}));
  if(vacationMin) taskTableRows.push(["Godišnji odmor", minutesToHM(vacationMin)]);

  y = pdfTable(pdf, {x:marginL, y:y+4, pageH, colWidths:[pageW-2*marginL-40,40], colAligns:["left","right"], header:["Task","Sati"], rows:taskTableRows});

  y += 10;
  pdf.setFont("helvetica","bold"); pdf.setFontSize(11); pdf.setTextColor(30,30,30);
  pdf.text("Dnevni pregled", marginL, y);
  y += 5;
  const dailyTableRows = dailyItems.length
    ? dailyItems.map(it=>[it.item_date, TYPE_META[it.item_type].label, it.item_type==="task"?(it.task_number||"—"):"—", minutesToHM(it.duration_minutes)])
    : [["Nema unosa","","",""]];
  pdfTable(pdf, {x:marginL, y, pageH, colWidths:[28,32,60,pageW-2*marginL-120], colAligns:["left","left","left","right"], header:["Datum","Tip","Task","Trajanje"], rows:dailyTableRows});

  pdfFooter(pdf, marginL, pageW, pageH);
  pdf.save(filenameBase.replace(/[^a-zA-Z0-9čćšđžČĆŠĐŽ_-]+/g,"-") + ".pdf");
}

function hexToRgbArr(hex){
  hex = (hex||"#999999").replace("#","");
  if(hex.length!==6) return [153,153,153];
  return [parseInt(hex.substr(0,2),16), parseInt(hex.substr(2,2),16), parseInt(hex.substr(4,2),16)];
}
function greenIntensityColor(intensity){
  intensity = Math.max(0, Math.min(1, intensity));
  return [
    Math.round(255 + (0-255)*intensity),
    Math.round(255 + (160-255)*intensity),
    Math.round(255 + (59-255)*intensity),
  ];
}
function buildMonthOverviewPdf(filenameBase){
  const st = state.monthOverview;
  const scopeLabel = st.scope==="week"
    ? fmtDateShort(st.rangeStart)+"-"+fmtDateShort(st.rangeEnd)+" "+st.year+"."
    : MONTHS_HR[st.month-1]+" "+st.year+".";
  const activeEmps = state.employees.filter(e=>e.active);

  const capacityStats = activeEmps.map(emp=>{
    const { availableMin, vacationMin } = employeeRangeCapacity(emp.id, st.rangeStart, st.rangeEnd, st.items);
    const bookedMin = st.items.filter(it=>it.employee_id===emp.id && it.item_type!=="vacation")
      .reduce((s,it)=>s+effectiveWorkMinutes(it.start_time, it.duration_minutes), 0);
    const freeMin = Math.max(0, availableMin-bookedMin);
    const overMin = Math.max(0, bookedMin-availableMin);
    const pct = availableMin>0 ? Math.round(bookedMin/availableMin*100) : (bookedMin>0 ? 999 : 0);
    return { emp, availableMin, bookedMin, vacationMin, freeMin, overMin, pct };
  }).filter(x=>x.availableMin>0 || x.bookedMin>0).sort((a,b)=>b.pct-a.pct);

  const taskMap = {};
  st.items.filter(it=>it.item_type==="task").forEach(it=>{
    const k = it.task_number||"(bez broja)";
    taskMap[k] = (taskMap[k]||0)+it.duration_minutes;
  });
  const taskRows = Object.entries(taskMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const maxTask = Math.max(1, ...taskRows.map(([,m])=>m));

  const dayMap = {};
  st.items.forEach(it=>{ if(it.item_type!=="vacation") dayMap[it.item_date]=(dayMap[it.item_date]||0)+it.duration_minutes; });
  const maxDay = Math.max(1, ...Object.values(dayMap));

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");
  const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
  const marginL = 15, marginR = 15, marginB = 20;
  let y = pdfHeader(pdf, marginL, pageW, "Pregled - "+scopeLabel, activeEmps.length+" aktivnih zaposlenika");
  function ensureSpace(need){ if(y+need > pageH-marginB){ pdf.addPage(); y = 20; } }

  // ---- Iskoristenost kapaciteta (vizualne trake, kao na ekranu) ----
  ensureSpace(10);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(11); pdf.setTextColor(30,30,30);
  pdf.text("Iskoristenost kapaciteta", marginL, y); y += 8;
  if(!capacityStats.length){
    pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(130,130,130);
    pdf.text("Nema podataka za ovo razdoblje.", marginL, y); y += 8;
  } else {
    const barW = pageW - marginL - marginR - 45;
    // Zbroj cijelog tima - jedan redak na vrhu, malo istaknutiji
    const teamTotals = capacityStats.reduce((acc,x)=>({
      bookedMin: acc.bookedMin+x.bookedMin, availableMin: acc.availableMin+x.availableMin,
      vacationMin: acc.vacationMin+x.vacationMin,
    }), {bookedMin:0, availableMin:0, vacationMin:0});
    const teamPct = teamTotals.availableMin>0 ? Math.round(teamTotals.bookedMin/teamTotals.availableMin*100) : 0;
    ensureSpace(16);
    pdf.setFont("helvetica","bold"); pdf.setFontSize(9); pdf.setTextColor(30,30,30);
    pdf.text("Cijeli tim", marginL, y);
    const teamBarY = y+2.4, teamBarH = 4.2;
    pdf.setFillColor(230,231,235);
    pdf.roundedRect(marginL, teamBarY, barW, teamBarH, 1, 1, "F");
    const teamFillW = teamPct>0 ? Math.max(barW*Math.min(100,teamPct)/100, 2) : 0;
    if(teamFillW>0){ pdf.setFillColor(0,130,47); pdf.roundedRect(marginL, teamBarY, teamFillW, teamBarH, 1, 1, "F"); }
    pdf.setFont("helvetica","bold"); pdf.setFontSize(9); pdf.setTextColor(40,40,40);
    pdf.text(teamPct+"%", marginL+barW+4, y);
    pdf.setFont("helvetica","normal"); pdf.setFontSize(7.3); pdf.setTextColor(110,110,110);
    pdf.text(pdfSafe(minutesToHM(teamTotals.bookedMin)+" od "+minutesToHM(teamTotals.availableMin)+" dostupno ukupno"
      +(teamTotals.vacationMin?" - "+minutesToHM(teamTotals.vacationMin)+" godisnji":"")), marginL, y+9.5);
    pdf.setTextColor(30,30,30);
    y += 15;
    pdf.setDrawColor(225,227,231); pdf.setLineWidth(0.2);
    pdf.line(marginL, y-4, marginL+barW+40, y-4);

    capacityStats.forEach(x=>{
      ensureSpace(15.5);
      pdf.setFont("helvetica","bold"); pdf.setFontSize(8.5); pdf.setTextColor(40,40,40);
      pdf.text(pdfSafe(x.emp.name), marginL, y);
      const barY = y+2.2, barH = 3.6;
      pdf.setFillColor(238,239,242);
      pdf.roundedRect(marginL, barY, barW, barH, 1, 1, "F");
      const rgb = hexToRgbArr(x.emp.color);
      const fillW = x.pct>0 ? Math.max(barW*Math.min(100,x.pct)/100, 2) : 0;
      if(fillW>0){ pdf.setFillColor(rgb[0],rgb[1],rgb[2]); pdf.roundedRect(marginL, barY, fillW, barH, 1, 1, "F"); }
      if(x.pct>100){
        pdf.setFillColor(224,60,60);
        const overW = Math.min(barW*0.12+2, barW);
        pdf.rect(Math.max(marginL, marginL+barW-overW), barY, overW, barH, "F");
      }
      pdf.setFont("helvetica","bold"); pdf.setFontSize(8.5);
      pdf.setTextColor(x.pct>100?210:40, 40, 40);
      pdf.text(x.pct+"%", marginL+barW+4, y);
      const subtext = minutesToHM(x.bookedMin)+" od "+minutesToHM(x.availableMin)+" dostupno"
        + (x.vacationMin?" - "+minutesToHM(x.vacationMin)+" godisnji":"")
        + (x.overMin ? " - "+minutesToHM(x.overMin)+" preko" : (x.freeMin?" - "+minutesToHM(x.freeMin)+" slobodno":""));
      pdf.setFont("helvetica","normal"); pdf.setFontSize(7); pdf.setTextColor(130,130,130);
      pdf.text(pdfSafe(subtext), marginL, y+9);
      pdf.setTextColor(30,30,30);
      y += 14;
    });
  }

  // ---- Najvise radnih sati po tasku (vizualne trake) ----
  y += 5; ensureSpace(10);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(11); pdf.setTextColor(30,30,30);
  pdf.text("Najvise radnih sati po tasku", marginL, y); y += 7;
  if(!taskRows.length){
    pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(130,130,130);
    pdf.text("Nema taskova u ovom razdoblju.", marginL, y); y += 8;
  } else {
    const barW2 = pageW - marginL - marginR - 35;
    taskRows.forEach(([k,m])=>{
      ensureSpace(8);
      pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.setTextColor(40,40,40);
      pdf.text(pdfSafe(k), marginL, y);
      const barY = y+1.8, barH = 3.5;
      pdf.setFillColor(238,239,242);
      pdf.roundedRect(marginL, barY, barW2, barH, 1, 1, "F");
      const w = Math.max(barW2*(m/maxTask), 2);
      pdf.setFillColor(0,160,59);
      pdf.roundedRect(marginL, barY, w, barH, 1, 1, "F");
      pdf.setFont("helvetica","bold"); pdf.setFontSize(8); pdf.setTextColor(40,40,40);
      pdf.text(minutesToHM(m), marginL+barW2+3, y);
      y += 7.5;
    });
  }

  // ---- Toplinska mapa - radni sati po danu ----
  y += 5;
  const daysList = st.scope==="week"
    ? Array.from({length:7},(_,i)=>fmtISO(addDays(new Date(st.rangeStart+"T00:00:00"), i)))
    : Array.from({length:new Date(st.year, st.month, 0).getDate()},(_,i)=>st.year+"-"+String(st.month).padStart(2,"0")+"-"+String(i+1).padStart(2,"0"));
  ensureSpace(24);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(11); pdf.setTextColor(30,30,30);
  pdf.text("Radni sati po danu", marginL, y); y += 7;
  const cellsPerRow = 7, cellGap = 1.3;
  const totalCellW = pageW-marginL-marginR;
  const cellW = (totalCellW-(cellsPerRow-1)*cellGap)/cellsPerRow;
  const cellH = 13;
  const startPad = st.scope==="week" ? 0 : (new Date(st.year, st.month-1, 1).getDay()+6)%7;
  let colIdx = 0, cursorX = marginL, cursorY = y;
  for(let i=0;i<startPad;i++){ cursorX += cellW+cellGap; colIdx++; }
  daysList.forEach((dISO)=>{
    if(colIdx>=cellsPerRow){
      colIdx=0; cursorX=marginL; cursorY+=cellH+cellGap;
      if(cursorY+cellH > pageH-marginB){ pdf.addPage(); cursorY = 20; }
    }
    const mins = dayMap[dISO]||0;
    const hol = holidayName(dISO); const weekend = isWeekend(dISO);
    const dayNum = parseInt(dISO.slice(-2));
    const intensity = mins/maxDay;
    const fillColor = mins===0 ? ((hol||weekend)?[228,230,233]:[248,249,250]) : greenIntensityColor(0.2+intensity*0.7);
    pdf.setDrawColor(222,224,228); pdf.setLineWidth(0.15);
    pdf.setFillColor(fillColor[0],fillColor[1],fillColor[2]);
    pdf.rect(cursorX, cursorY, cellW, cellH, "FD");
    const lightText = mins>0 && intensity>0.55;
    pdf.setFont("helvetica","bold"); pdf.setFontSize(7);
    pdf.setTextColor(lightText?255:110, lightText?255:110, lightText?255:110);
    pdf.text(String(dayNum), cursorX+1.5, cursorY+4.5);
    if(mins>0){
      pdf.setFont("helvetica","normal"); pdf.setFontSize(6.2);
      pdf.text(minutesToHM(mins), cursorX+1.5, cursorY+9.5);
    }
    pdf.setTextColor(30,30,30);
    cursorX += cellW+cellGap; colIdx++;
  });
  y = cursorY+cellH+8;

  pdfFooter(pdf, marginL, pageW, pageH);
  pdf.save(pdfSafe(filenameBase).replace(/[^a-zA-Z0-9_-]+/g,"-") + ".pdf");
}

async function exportPdf(filenameBase){
  if(!window.jspdf){
    showToast("PDF alat nije dostupan (provjeri internet vezu) — otvaram standardni ispis.");
    window.print();
    return;
  }
  try{
    if(state.reportModal){ buildWeeklyReportPdf(filenameBase); }
    else if(state.monthOverview){ buildMonthOverviewPdf(filenameBase); }
    else { throw new Error("Nepoznat kontekst izvještaja"); }
    showToast("PDF preuzet.");
  }catch(err){
    console.error("PDF export error:", err);
    const msg = (err && (err.message || err.name)) || (typeof err==="string" ? err : "") || "nepoznata greška (vidi konzolu, F12)";
    showToast("Greška kod izvoza PDF-a: "+msg+" — otvaram standardni ispis kao zamjenu.");
    window.print();
  }
}

/* ---- lightweight refresh for filter-only changes (skips rebuilding the whole page) ---- */
function refreshScheduleArea(){
  const el = document.getElementById("scheduleArea");
  if(!el){ render(); return; }
  const snap = captureScroll();
  el.outerHTML = renderScheduleArea();
  bindScheduleAreaEvents();
  restoreScroll(snap);
}
function bindScheduleAreaEvents(){
  const root = document.getElementById("scheduleArea");
  if(!root) return;
  root.querySelectorAll(".item-block").forEach(block=>{
    block.addEventListener("mousedown",(e)=>{ if(e.button!==0 || e.target.dataset.act==="resize-handle" || e.target.closest(".hover-popup") || e.target.closest(".item-del") || e.target.closest(".item-done-btn") || e.target.closest(".flag-link")) return; startDrag(e, block, "move"); });
  });
  root.querySelectorAll(".resize-handle").forEach(h=>{
    h.addEventListener("mousedown",(e)=>{ if(e.button!==0) return; e.stopPropagation(); startDrag(e, h.closest(".item-block"), "resize"); });
  });
  root.querySelectorAll(".mb-block").forEach(b=>{
    b.addEventListener("mousedown",(e)=>{ if(e.button!==0 || e.target.closest(".flag-link") || e.target.closest(".mb-resize") || e.target.closest(".hover-popup") || e.target.closest(".item-del") || e.target.closest(".item-done-btn")) return; startMiniDrag(e, b); });
  });
  root.querySelectorAll(".mb-resize").forEach(h=>{
    h.addEventListener("mousedown",(e)=>{ if(e.button!==0) return; e.stopPropagation(); startMiniResize(e, h.closest(".mb-block")); });
  });

  /* ---- copy/paste: desni klik meni (varijanta 1) ---- */
  root.querySelectorAll(".item-block, .mb-block").forEach(block=>{
    block.addEventListener("contextmenu",(e)=>{
      e.preventDefault(); e.stopPropagation();
      const item = state.items.find(x=>x.id===block.dataset.id);
      if(!item) return;
      state.contextMenu = { mode:"task", x:e.clientX, y:e.clientY, itemId:item.id };
      render();
    });
  });
  root.querySelectorAll(".slot-hit, .mboard").forEach(slot=>{
    slot.addEventListener("contextmenu",(e)=>{
      e.preventDefault();
      const target = getSlotTargetAtPoint(e.clientX, e.clientY);
      if(!target) return;
      state.contextMenu = Object.assign({ mode:"slot", x:e.clientX, y:e.clientY }, target);
      render();
    });
  });

  const ovTooltip = document.getElementById("ovTooltip");
  if(ovTooltip){
    root.querySelectorAll(".ov-cell").forEach(cell=>{
      cell.addEventListener("mousemove",(e)=>{
        ovTooltip.style.display="block";
        ovTooltip.style.left = e.clientX+"px";
        ovTooltip.style.top = e.clientY+"px";
        const mIdx = new Date(cell.dataset.date+"T00:00:00").getMonth();
        ovTooltip.innerHTML = `<b>${cell.dataset.name}</b> — ${cell.dataset.day}. ${MONTHS_HR[mIdx]}<br>${cell.dataset.label}`;
      });
      cell.addEventListener("mouseleave",()=>{ ovTooltip.style.display="none"; });
    });
  }
}

async function addEmployee(){
  const input = document.getElementById("newEmpName");
  const name = input.value.trim();
  if(!name) return;
  const color = EMP_COLORS[state.employees.length % EMP_COLORS.length];
  const parts = name.split(/\s+/).filter(Boolean);
  const initials = ((parts[0]||"")[0]||"") + ((parts[1]||"")[0]||"");
  try{
    const created = await Employees.create({name,color,active:true, initials: initials ? initials.toUpperCase() : null});
    const row = Array.isArray(created) ? created[0] : created;
    state.employees.push(row);
    render();
  }catch(err){ showToast("Greška: "+err.message); }
}

  state.duplicatePanel.year=year; state.duplicatePanel.month=month;

function toggleDupDate(dateISO){
  const sel = state.duplicatePanel.selectedDates;
  if(sel.has(dateISO)) sel.delete(dateISO); else sel.add(dateISO);
  render();
}
function dupQuickAdd(kind){
  const base = new Date(state.itemModal.data.item_date+"T00:00:00");
  const sel = state.duplicatePanel.selectedDates;
  if(kind==="tomorrow"){
    sel.add(fmtISO(addDays(base,1)));
  } else if(kind==="weekdays5"){
    let d = new Date(base), count=0;
    while(count<5){
      d = addDays(d,1);
      if(!isWeekend(fmtISO(d))){ sel.add(fmtISO(d)); count++; }
    }
  } else if(kind==="nextweek"){
    sel.add(fmtISO(addDays(base,7)));
  }
  const last = [...sel].sort().pop();
  if(last){ const ld = new Date(last+"T00:00:00"); state.duplicatePanel.year=ld.getFullYear(); state.duplicatePanel.month=ld.getMonth()+1; }
  render();
}
function renderDuplicatePanel(){
  const dp = state.duplicatePanel;
  const origDate = state.itemModal.data.item_date;
  const firstOfMonth = new Date(dp.year, dp.month-1, 1);
  const startOffset = (firstOfMonth.getDay()+6)%7;
  const daysInMonth = new Date(dp.year, dp.month, 0).getDate();
  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
  let cells = "";
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startOffset + 1;
    if(dayNum<1 || dayNum>daysInMonth){ cells += `<button class="dp-day empty"></button>`; continue; }
    const dISO = dp.year+"-"+String(dp.month).padStart(2,"0")+"-"+String(dayNum).padStart(2,"0");
    const isSel = dp.selectedDates.has(dISO), isToday = dISO===todayISO(), isOrig = dISO===origDate;
    cells += `<button class="dp-day ${isSel?"sel":""} ${isToday?"today":""} ${isOrig?"orig":""}" data-act="toggle-dup-date" data-date="${dISO}" title="${isOrig?'Izvorni datum':''}">${dayNum}</button>`;
  }
  const count = dp.selectedDates.size;
  return `<div class="overlay top" data-act="close-duplicate">
    <div class="modal narrow" data-stop="1">
      <h2 style="margin-bottom:10px;">${dp.deferred ? "Kreiraj i na dodatne dane" : "Kopiraj na više dana"}</h2>
      <div class="dup-quick">
        <button class="btn btn-ghost btn-sm" data-act="dup-quick" data-kind="tomorrow">Sutra</button>
        <button class="btn btn-ghost btn-sm" data-act="dup-quick" data-kind="weekdays5">Idućih 5 radnih dana</button>
        <button class="btn btn-ghost btn-sm" data-act="dup-quick" data-kind="nextweek">Isti dan idući tjedan</button>
      </div>
      <div class="dp-head">
        <button class="btn btn-icon btn-ghost" data-act="dup-prev-month">${icon('chevronLeft',14)}</button>
        <div class="dp-title">${MONTHS_HR[dp.month-1]} ${dp.year}.</div>
        <button class="btn btn-icon btn-ghost" data-act="dup-next-month">${icon('chevronRight',14)}</button>
      </div>
      <div class="dp-grid">${DAYS_HR_SHORT.map(d=>`<div class="dp-dow">${d}</div>`).join("")}${cells}</div>

async function confirmDuplicate(){

    state.itemModal.extraDates = new Set(dates);
    state.duplicatePanel = null;
    render();
    return;
  }

    task_number:d.task_number, task_link:d.task_link, assigned_note:d.assigned_note,
    first_version_date:d.first_version_date, due_date:d.due_date,
  };
  let created=0, failed=0;
  await withUndoBatch("dupliciranje na "+dates.length+" dana", async ()=>{
    for(const dateISO of dates){
      try{ await Items.create(Object.assign({}, base, {item_date:dateISO})); created++; }
      catch(err){ failed++; }
    }
  });
  state.duplicatePanel = null;

  render();

async function saveItem(){
  const st = state.itemModal; const d = st.data;
  d.employee_id = document.getElementById("f_employee").value;
  d.assigned_note = document.getElementById("f_note").value.trim() || null;
  if(d.item_type==="task"){
    const suffix = document.getElementById("f_task_number").value.trim();
    d.task_number = suffix ? ("TEVA-"+suffix) : null;
    d.task_link = normalizeUrl(document.getElementById("f_task_link").value.trim()) || null;
  } else { d.task_number=null; d.task_link=null; d.first_version_date=null; d.due_date=null; }
  const wholeDayEl = document.getElementById("f_whole_day");
  if(d.item_type==="vacation" && wholeDayEl && wholeDayEl.checked){ d.start_time="08:00"; d.duration_minutes=540; }
  else { d.start_time = document.getElementById("f_start_time").value; d.duration_minutes = parseInt(document.getElementById("f_duration").value); }

  const payload = {
    employee_id:d.employee_id, item_type:d.item_type, item_date:d.item_date, start_time:d.start_time, duration_minutes:d.duration_minutes,
    task_number:d.task_number, task_link:d.task_link, assigned_note:d.assigned_note, first_version_date:d.first_version_date, due_date:d.due_date,
  };

  // CREATE mode: podržava odmah kreiranje na više odabranih dana ("Kopiraj i na druge dane"),
  // svaki dan zasebno poštuje pauzu za ručak, sve grupirano kao JEDNA logička radnja (undo/redo).
  if(st.mode==="create"){
    const extraDates = st.extraDates ? Array.from(st.extraDates) : [];
    const allDates = [d.item_date, ...extraDates];
    let anySplit = false;
    try{
      await withUndoBatch(allDates.length>1 ? ("dodavanje na "+allDates.length+" dana") : "dodavanje", async ()=>{
        for(const dateISO of allDates){
          const dayPayload = Object.assign({}, payload, {item_date:dateISO});
          const segments = computeSplitAroundOccupied(d.item_type, d.start_time, d.duration_minutes, d.employee_id, dateISO, null);
          if(!segments){
            const row = await Items.create(dayPayload); state.items.push(row);
          } else {
            anySplit = true;
            for(const seg of segments){
              const row = await Items.create(Object.assign({}, dayPayload, seg));
              state.items.push(row);
            }
          }
        }
      });
      state.itemModal=null; render();
      const parts = [];
      if(allDates.length>1) parts.push(`Kreirano na ${allDates.length} dana.`);
      else parts.push("Task dodan.");
      if(anySplit) parts.push("Neki unosi su razdvojeni oko postojećih obaveza (pauza/drugi task) — ukupno trajanje je sačuvano.");
      showToast(parts.join(" "));
    }catch(err){ st.error=err.message; render(); }
    return;
  }

  // EDIT mode (postojeća stavka)
  const segments = computeSplitAroundOccupied(d.item_type, d.start_time, d.duration_minutes, d.employee_id, d.item_date, st.id);

  try{
    if(segments){
      await withUndoBatch("razdvajanje oko postojećih obaveza", async ()=>{
        const payload1 = Object.assign({}, payload, segments[0]);
        const row1 = await Items.update(st.id, payload1);
        const idx = state.items.findIndex(x=>x.id===st.id);
        if(idx>-1) state.items[idx] = Array.isArray(row1)?row1[0]:row1;
        for(let i=1;i<segments.length;i++){
          const row = await Items.create(Object.assign({}, payload, segments[i]));
          state.items.push(Array.isArray(row)?row[0]:row);
        }
      });
      state.itemModal=null; render();
      showToast(segments.length===1
        ? "Vrijeme je prilagođeno da ne upada u postojeću obavezu (pomaknuto na "+segments[0].start_time+")."
        : "Task ide preko postojeće obaveze — razdvojen u "+segments.length+" dijela, ukupno trajanje sačuvano.");
      return;
    }
    const updated = await Items.update(st.id, payload);
    const row = Array.isArray(updated)?updated[0]:updated;
    const idx = state.items.findIndex(x=>x.id===st.id);
    if(idx>-1) state.items[idx]=row;
    state.itemModal=null; render();
  }catch(err){ st.error=err.message; render(); }
}

  const st = state.itemModal;
  if(!st.id) return;
  if(!confirm("Obrisati ovu stavku?")) return;
  try{ await Items.remove(st.id); state.items=state.items.filter(x=>x.id!==st.id); state.itemModal=null; render(); }

/* ---- day-view drag / resize (pixel precise) ---- */
function startDrag(e, blockEl, mode){
  e.preventDefault();
  const id = blockEl.dataset.id;
  const item = state.items.find(x=>x.id===id);
  if(!item) return;
  drag = { kind:"day", mode, id, blockEl, startY:e.clientY, startX:e.clientX, origStart:item.start_time, origDuration:item.duration_minutes, origEmployee:item.employee_id };
  blockEl.classList.add("dragging");
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
}
function onDragMove(e){
  if(!drag || drag.kind!=="day") return;
  const dayPxPerMin = state.settings.row_px_day/30;
  const daySlotPx = SLOT_MIN*dayPxPerMin;
  const deltaY = e.clientY - drag.startY;
  const slotDelta = Math.round(deltaY/daySlotPx);
  if(drag.mode==="resize"){
    const newDur = Math.max(SLOT_MIN, drag.origDuration + slotDelta*SLOT_MIN);
    const cappedDur = Math.min(newDur, GRID_END_MIN - timeToMinutes(drag.origStart));
    drag.blockEl.style.height = Math.max(cappedDur*dayPxPerMin-3,20)+"px";
    drag.pendingDuration = cappedDur;
  } else {
    let newStartMin = timeToMinutes(drag.origStart) + slotDelta*SLOT_MIN;
    newStartMin = Math.max(GRID_START_MIN, Math.min(newStartMin, GRID_END_MIN-SLOT_MIN));
    drag.pendingStart = minutesToTime(newStartMin);
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const col = under ? under.closest(".emp-track") : null;
    if(col && col.dataset.emp) drag.pendingEmployee = col.dataset.emp;
    if(!drag.ghost){ drag.ghost = document.createElement("div"); drag.ghost.className="drop-ghost"; drag.blockEl.style.visibility="hidden"; }
    if(drag.hoverEl !== col){
      if(drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
      if(col) col.appendChild(drag.ghost);
      drag.hoverEl = col;
    }
    if(drag.ghost.parentNode){
      drag.ghost.style.top = (16+(newStartMin-GRID_START_MIN)*dayPxPerMin)+"px";
      drag.ghost.style.height = Math.max(drag.origDuration*dayPxPerMin-3,20)+"px";
    }
    drag.ghost.classList.toggle("copy-mode", !!e.altKey);
  }
}
async function createCopyAt(item, changedFields){
  const base = Object.assign({}, itemDataFields(item), changedFields);
  const extra = trimAgainstOthersAndDailyCap(base.item_type, base.start_time, base.duration_minutes, base.employee_id, base.item_date, null);
  const row = await Items.create(Object.assign({}, base, {start_time:extra.start_time, duration_minutes:extra.duration_minutes})); state.items.push(row);
  if(extra.capped) showToast("Kopija prelazi dnevnu kvotu od 7h — skraćena na "+minutesToHM(extra.duration_minutes)+".");
  else if(extra.changed) showToast("Kopirano na "+extra.start_time+" — tamo je bilo zauzeto.");
}
async function onDragEnd(e){
  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);
  if(!drag) return;
  const d = drag; drag=null;
  d.blockEl.classList.remove("dragging");
  d.blockEl.style.visibility="";
  if(d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  const item = state.items.find(x=>x.id===d.id);
  if(!item){ if(d.ghost) suppressClickUntil = Date.now()+300; return; }
  let payload={}, changed=false;
  if(d.mode==="resize" && d.pendingDuration && d.pendingDuration!==d.origDuration){ payload.duration_minutes=d.pendingDuration; changed=true; }
  if(d.mode==="move"){
    if(d.pendingStart && d.pendingStart!==d.origStart){ payload.start_time=d.pendingStart; changed=true; }
    if(d.pendingEmployee && d.pendingEmployee!==d.origEmployee){ payload.employee_id=d.pendingEmployee; changed=true; }
  }
  // svaka stvarna promjena (pomak ILI resize) mijenja layout ispod kursora, pa sljedeći "duh-klik" na
  // prazan slot treba blokirati - ne samo kad je bio "ghost" (koji postoji samo kod pomicanja, ne resizea)
  if(changed || d.ghost){ suppressClickUntil = Date.now()+300; }
  if(!changed) return;
  if(d.mode==="move" && e.altKey){
    try{ await createCopyAt(item, payload); render(); showToast("Kopirano na novo mjesto — original je ostao netaknut."); }
    catch(err){ showToast("Greška kod kopiranja: "+err.message); }
    return;
  }
  try{ await applyChangeWithLunchSplit(item, payload, d.mode); render(); }
  catch(err){ showToast("Greška kod pomicanja: "+err.message); await loadVisibleItems(true); render(); }
}
/* ---- multi-day mini-board drag (precise time + day/employee move) ---- */
function startMiniDrag(e, blockEl){
  e.preventDefault();
  const id = blockEl.dataset.id;
  const item = state.items.find(x=>x.id===id);
  if(!item) return;
  const board = blockEl.closest(".mboard");
  drag = { kind:"mini", id, blockEl, startX:e.clientX, startY:e.clientY, moved:false,
    origStart:item.start_time, origDuration:item.duration_minutes, origEmployee:item.employee_id, origDate:item.item_date, slotPx: parseInt(board.dataset.slotpx) };
  document.addEventListener("mousemove", onMiniDragMove);
  document.addEventListener("mouseup", onMiniDragEnd);
}
function onMiniDragMove(e){
  if(!drag || drag.kind!=="mini") return;
  const dist = Math.hypot(e.clientX-drag.startX, e.clientY-drag.startY);
  if(dist>4 && !drag.moved){
    drag.moved=true;
    drag.blockEl.style.visibility="hidden";
    drag.ghost = document.createElement("div");
    drag.ghost.className = "drop-ghost drop-ghost-mini";
  }
  if(!drag.moved) return;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const board = under ? under.closest(".mboard") : null;
  if(drag.hoverEl !== board){
    if(drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    if(board) board.appendChild(drag.ghost);
    drag.hoverEl = board;
  }
  if(board){
    drag.pendingEmployee = board.dataset.emp;
    drag.pendingDate = board.dataset.date;
    const rect = board.getBoundingClientRect();
    const pad = parseInt(board.dataset.pad||"0");
    const relY = e.clientY - rect.top - pad;
    const slotPx = parseInt(board.dataset.slotpx);
    const pxPerMin = slotPx/30;
    let minuteOffset = Math.round((relY/pxPerMin)/SLOT_MIN)*SLOT_MIN;
    minuteOffset = Math.max(0, Math.min(540-SLOT_MIN, minuteOffset));
    drag.pendingStart = minutesToTime(GRID_START_MIN + minuteOffset);
    if(drag.ghost.parentNode){
      drag.ghost.style.top = (pad+minuteOffset*pxPerMin)+"px";
      drag.ghost.style.height = Math.max(drag.origDuration*pxPerMin-1,9)+"px";
    }
    drag.ghost.classList.toggle("copy-mode", !!e.altKey);
  }
}
async function onMiniDragEnd(e){
  document.removeEventListener("mousemove", onMiniDragMove);
  document.removeEventListener("mouseup", onMiniDragEnd);
  if(!drag || drag.kind!=="mini") return;
  const d = drag; drag=null;
  d.blockEl.style.visibility="";
  if(d.moved){ suppressClickUntil = Date.now()+300; }
  if(d.ghost && d.ghost.parentNode) d.ghost.parentNode.removeChild(d.ghost);
  if(!d.moved) return; // treat as a plain click; native click event opens edit modal
  const item = state.items.find(x=>x.id===d.id);
  if(!item) return;
  const payload = {}; let changed=false;
  if(d.pendingEmployee && d.pendingEmployee!==d.origEmployee){ payload.employee_id=d.pendingEmployee; changed=true; }
  if(d.pendingDate && d.pendingDate!==d.origDate){ payload.item_date=d.pendingDate; changed=true; }
  if(d.pendingStart && d.pendingStart!==d.origStart){ payload.start_time=d.pendingStart; changed=true; }
  if(!changed) return;
  if(e.altKey){
    try{ await createCopyAt(item, payload); render(); showToast("Kopirano na novo mjesto — original je ostao netaknut."); }
    catch(err){ showToast("Greška kod kopiranja: "+err.message); }
    return;
  }
  try{ await applyChangeWithLunchSplit(item, payload, "move"); render(); }
  catch(err){ showToast("Greška kod pomicanja: "+err.message); await loadVisibleItems(true); render(); }
}
function addItemFromBoardClick(boardEl, e){

async function openReport(employeeId){
  const [ws,we] = weekRangeOf(state.currentDate);
  state.reportModal = { loading:true, employeeId, weekStart:ws, weekEnd:we, items:[] };
  render();
  try{
    const items = await Items.listRange(ws,we);
    state.reportModal.items = (items||[]).filter(it=>it.employee_id===employeeId);
  }catch(err){ showToast("Greška kod izvještaja: "+err.message); state.reportModal.items=[]; }

function weekRangeOf(dateISO){
  const d = new Date(dateISO+"T00:00:00");
  const wd = (d.getDay()+6)%7;
  const monday = addDays(d,-wd), sunday = addDays(monday,6);
  return [fmtISO(monday), fmtISO(sunday)];
}

/* ---- month overview ---- */
function weeksInMonth(year, month){
  const first = new Date(year, month-1, 1);
  const last = new Date(year, month, 0);
  const weeks = [];
  let d = addDays(first, -((first.getDay()+6)%7));
  while(d<=last){
    weeks.push({ start: fmtISO(d), end: fmtISO(addDays(d,6)) });
    d = addDays(d,7);
  }
  return weeks;
}
async function openMonthOverview(scope, rangeStart){
  const base = new Date(state.currentDate+"T00:00:00");
  const year = base.getFullYear(), month = base.getMonth()+1;
  scope = scope || "month";
  let start, end;
  if(scope==="week"){
    if(rangeStart){ start = rangeStart; end = fmtISO(addDays(new Date(rangeStart+"T00:00:00"),6)); }
    else { const wd=(base.getDay()+6)%7; start = fmtISO(addDays(base,-wd)); end = fmtISO(addDays(base,6-wd)); }
  } else {
    start = year+"-"+String(month).padStart(2,"0")+"-01";
    const lastDay = new Date(year, month, 0).getDate();
    end = year+"-"+String(month).padStart(2,"0")+"-"+String(lastDay).padStart(2,"0");
  }
  state.monthOverview = { loading:true, scope, year, month, rangeStart:start, rangeEnd:end, items:[] };

  try{
    state.monthOverview.items = await Items.listRange(start,end) || [];
  }catch(err){ showToast("Greška kod pregleda: "+err.message); state.monthOverview.items=[]; }
  state.monthOverview.loading=false;
  render();
}

      <div class="barrow-val ${x.pct>100?'over':''}">${x.pct}%</div>
    </div>
    <div class="cap-subline">${minutesToHM(x.bookedMin)} od ${minutesToHM(x.availableMin)} dostupno${x.vacationMin?` · ${minutesToHM(x.vacationMin)} godišnji`:""}${x.overMin?` · <span class="over-text">${minutesToHM(x.overMin)} preko</span>`:(x.freeMin?` · ${minutesToHM(x.freeMin)} slobodno`:"")}</div>`;
  }).join("") || `<p class="mo-empty">Nema podataka za ovaj mjesec.</p>`;

  const taskBars = taskRows.map(([k,m])=>`
    <div class="barrow">
      <div class="barrow-label mono">${escapeHtml(k)}</div>
      <div class="barrow-track"><div class="barrow-fill" style="width:${(m/maxTask*100).toFixed(1)}%;background:var(--accent)"></div></div>
      <div class="barrow-val">${minutesToHM(m)}</div>
    </div>`).join("") || `<p class="mo-empty">Nema taskova ovaj mjesec.</p>`;

  let heatCells = "";
  let heatDowLabels = DAYS_HR_SHORT;
  if(st.scope==="week"){
    for(let i=0;i<7;i++){
      const dISO = fmtISO(addDays(new Date(st.rangeStart+"T00:00:00"), i));
      const dayNum = new Date(dISO+"T00:00:00").getDate();
      const mins = dayMap[dISO]||0;
      const hol = holidayName(dISO); const weekend = isWeekend(dISO);
      const intensity = mins/maxDay;
      const bg = mins===0 ? ((hol||weekend)?"var(--muted-bg)":"var(--row-bg-b)") : `rgba(0,160,59,${(0.15+intensity*0.75).toFixed(2)})`;
      const txtColor = intensity>0.55 ? "#fff" : "inherit";
      heatCells += `<div class="heat-cell" style="background:${bg};color:${txtColor}">
        <div class="heat-daynum">${dayNum}</div>
        ${mins>0?`<div class="heat-hours">${minutesToHM(mins)}</div>`:""}
        ${vacDays.has(dISO)?`<div class="heat-vac">${icon('sun',9)}</div>`:""}
      </div>`;
    }
  } else {
    const firstOfMonth = new Date(st.year, st.month-1, 1);
    const startOffset = (firstOfMonth.getDay()+6)%7;
    const daysInMonth = new Date(st.year, st.month, 0).getDate();
    const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
    for(let i=0;i<totalCells;i++){
      const dayNum = i-startOffset+1;
      if(dayNum<1||dayNum>daysInMonth){ heatCells += `<div class="heat-cell empty"></div>`; continue; }
      const dISO = st.year+"-"+String(st.month).padStart(2,"0")+"-"+String(dayNum).padStart(2,"0");
      const mins = dayMap[dISO]||0;
      const hol = holidayName(dISO); const weekend = isWeekend(dISO);
      const intensity = mins/maxDay;
      const bg = mins===0 ? ((hol||weekend)?"var(--muted-bg)":"var(--row-bg-b)") : `rgba(0,160,59,${(0.15+intensity*0.75).toFixed(2)})`;
      const txtColor = intensity>0.55 ? "#fff" : "inherit";
      heatCells += `<div class="heat-cell" style="background:${bg};color:${txtColor}">
        <div class="heat-daynum">${dayNum}</div>
        ${mins>0?`<div class="heat-hours">${minutesToHM(mins)}</div>`:""}
        ${vacDays.has(dISO)?`<div class="heat-vac">${icon('sun',9)}</div>`:""}
      </div>`;
    }
  }

  const detailSections = activeEmps.map(emp=>{
    const items = st.items.filter(it=>it.employee_id===emp.id);
    const taskMap2={}; let internalMin=0, vacationMin=0;
    items.forEach(it=>{
      if(it.item_type==="task"){ const k=it.task_number||"(bez broja)"; taskMap2[k]=(taskMap2[k]||0)+it.duration_minutes; }
      else if(it.item_type==="internal_dev") internalMin+=it.duration_minutes;
      else if(it.item_type==="vacation") vacationMin+=it.duration_minutes;
    });
    const rows = Object.entries(taskMap2).sort((a,b)=>b[1]-a[1]);
    const total = rows.reduce((s,[,m])=>s+m,0)+internalMin;
    if(rows.length===0 && !internalMin && !vacationMin) return "";
    return `<div class="mo-emp-detail">
      <div class="mo-emp-name"><span class="col-dot" style="background:${emp.color}"></span>${escapeHtml(emp.name)}</div>
      <table class="rep"><thead><tr><th>Task</th><th style="text-align:right">Sati</th></tr></thead><tbody>
        ${rows.map(([k,m])=>`<tr><td class="mono">${escapeHtml(k)}</td><td style="text-align:right">${minutesToHM(m)}</td></tr>`).join("")}
        ${internalMin?`<tr><td>Interni razvoj</td><td style="text-align:right">${minutesToHM(internalMin)}</td></tr>`:""}
        <tr class="total"><td>Ukupno</td><td style="text-align:right">${minutesToHM(total)}</td></tr>
        ${vacationMin?`<tr><td>Godišnji odmor</td><td style="text-align:right">${minutesToHM(vacationMin)}</td></tr>`:""}
      </tbody></table>
    </div>`;
  }).join("") || `<p class="mo-empty">Nema unosa za ovaj mjesec.</p>`;

  const weeks = weeksInMonth(st.year, st.month);
  const scopeSwitcher = `<div class="mo-scope-row" data-noprint="1">
    <div class="seg">
      <button class="${st.scope==='week'?'active':''}" data-act="mo-scope" data-scope="week">Tjedan</button>
      <button class="${st.scope==='month'?'active':''}" data-act="mo-scope" data-scope="month">Mjesec</button>
    </div>
    ${st.scope==='week' ? `<div class="mo-week-picker">
      ${weeks.map(w=>`<button class="mo-week-btn ${w.start===st.rangeStart?'active':''}" data-act="mo-pick-week" data-start="${w.start}">${fmtDateShort(w.start)}–${fmtDateShort(w.end)}</button>`).join("")}
    </div>` : ""}
  </div>`;

  return `<div class="overlay" data-act="close-overlay">
    <div class="modal xwide" data-stop="1">
      ${scopeSwitcher}
      <div id="printArea" data-print-date="${new Date().toLocaleDateString('hr-HR')}"><div class="pdf-brandhead">RASPORED — DIZAJN TIM</div>
        <div class="report-head"><h2>Pregled — ${scopeLabel}</h2><div class="report-sub">Ukupno radnih sati: ${minutesToHM(grandTotal)}</div></div>

        <h4 class="mo-section-title">Iskorištenost resursa (7h dostupno po radnom danu)</h4>
        <div class="capacity-summary">
          <div class="cap-stat"><div class="cap-val">${minutesToHM(teamBooked)}</div><div class="cap-lbl">Iskorišteno</div></div>
          <div class="cap-stat"><div class="cap-val">${minutesToHM(Math.max(0,teamAvailable-teamBooked))}</div><div class="cap-lbl">Slobodno</div></div>
          <div class="cap-stat"><div class="cap-val ${teamPct>100?'over-text':''}">${teamPct}%</div><div class="cap-lbl">Popunjenost tima</div></div>
        </div>
        <div class="barchart">${capBars}</div>

        <h4 class="mo-section-title">Najviše sati po tasku</h4>
        <div class="barchart">${taskBars}</div>

        <h4 class="mo-section-title">Opterećenje po danu</h4>
        <div class="heat-grid">
          ${DAYS_HR_SHORT.map(d=>`<div class="heat-dow">${d}</div>`).join("")}
          ${heatCells}
        </div>

        <details class="mo-details">
          <summary>Detaljna razrada po zaposleniku i tasku</summary>
          ${detailSections}
        </details>
        <div class="pdf-brandfoot">Generirano ${new Date().toLocaleDateString('hr-HR')}</div>
      </div>
      <div class="pdf-hint">PDF se automatski preuzima na tvoje računalo.</div>
      <div class="modal-actions"><div></div><div class="right"><button class="btn" data-act="close-overlay">Zatvori</button><button class="btn btn-primary" data-act="print-report" data-filename="Pregled-${scopeLabel.replace(/\s+/g,'-').replace(/\./g,'')}">${icon("printer",13)} Izvezi kao PDF</button></div></div>
    </div>
  </div>`;
}

boot();
</script>
