<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raspored — Dizajn tim</title>
<meta name="description" content="Aplikacija za vođenje rasporeda dizajn tima">
<meta name="theme-color" content="#3454D1">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FBFBFC;
  --border:#E3E6EB; --border-strong:#CBD0D9;
  --text:#424242; --text-2:#6B7280; --text-3:#9AA1AE;
  --accent:#00A03B; --accent-dim:#E4F5EA; --accent-ink:#00822F;
  --teal:#3C7E79; --amber:#D97706; --amber-dim:#FDF1DE; --red:#DC4C4C;
  --radius:10px; --radius-lg:14px;
  --shadow:0 1px 2px rgba(20,24,38,.04), 0 4px 14px rgba(20,24,38,.06);
  --shadow-lg:0 10px 40px rgba(20,24,38,.16);
  --muted-bg:#F1F2F5;
  --row-bg-a:#FFFFFF; --row-bg-b:#F7F8FA;
  --row-today-a:#EAF7EE; --row-today-b:#E1F2E6;
  --row-muted-a:#F1F2F5; --row-muted-b:#ECEDF0;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171A; --surface:#1D2024; --surface-2:#24272C;
  --border:#33363C; --border-strong:#474B52;
  --text:#E7E8EA; --text-2:#A2A8B0; --text-3:#71767E;
  --accent:#22C55E; --accent-dim:rgba(34,197,94,.16); --accent-ink:#4ADE80;
  --teal:#5FB0A9; --amber:#F0A83D; --amber-dim:rgba(240,168,61,.16); --red:#F17272;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 10px 40px rgba(0,0,0,.55);
  --muted-bg:#202226;
  --row-bg-a:#1D2024; --row-bg-b:#212427;
  --row-today-a:#173321; --row-today-b:#142E1E;
  --row-muted-a:#202226; --row-muted-b:#1B1D21;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
#app{width:100%;margin:0 auto;padding:20px 24px 60px;box-sizing:border-box;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#AFCB37);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 3px 10px rgba(0,160,59,.35);}
.brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.2px;}
.brand .sub{font-size:12px;color:var(--text-2);margin-top:1px;}
.topbar-actions{display:flex;gap:8px;}

.btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px;}
.btn-danger{color:var(--red);}
.btn-danger:hover{border-color:var(--red);color:var(--red);background:#FDEDED;}

.controls-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;padding:3px;gap:2px;}
.seg button{border:none;background:transparent;padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:700;color:var(--text-2);}
.seg button.active{background:var(--accent);color:#fff;}
.nav-cluster{display:flex;align-items:center;gap:6px;}
.range-label{font-size:14px;font-weight:800;min-width:190px;text-align:center;}
.month-plus-row{display:flex;align-items:center;gap:6px;}
.tab-more{position:relative;}
.more-dropdown{position:absolute;top:38px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:170px;z-index:50;max-height:280px;overflow-y:auto;}
.more-dropdown .opt{padding:8px 10px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text);}
.more-dropdown .opt:hover{background:var(--accent-dim);color:var(--accent-ink);}

.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.emp-filter-dd{position:relative;}
.emp-filter-panel{position:absolute;top:38px;left:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:8px;min-width:220px;z-index:50;max-height:320px;overflow-y:auto;}
.initials-popover{position:absolute;top:38px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:10px;min-width:180px;z-index:50;}
.notif-badge{position:absolute;top:2px;right:2px;background:#DC4C4C;color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;line-height:1;}
.notif-popover{position:absolute;top:38px;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);width:300px;max-height:400px;overflow-y:auto;z-index:50;}
.notif-popover-head{font-size:12.5px;font-weight:800;padding:10px 12px;border-bottom:1px solid var(--border);}
.notif-list{display:flex;flex-direction:column;}
.notif-row{padding:9px 12px;border-bottom:1px solid var(--border);}
.notif-row:last-child{border-bottom:none;}
.notif-row.notif-unread{background:var(--accent-dim);}
.notif-msg{font-size:12px;color:var(--text);line-height:1.35;}
.notif-time{font-size:10px;color:var(--text-3);margin-top:2px;}
.initials-popover input{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid var(--border-strong);border-radius:7px;font-size:13px;}
.emp-filter-actions{display:flex;gap:6px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.emp-filter-actions button{flex:1;border:1px solid var(--border-strong);background:var(--surface-2);border-radius:6px;padding:5px;font-size:11px;font-weight:700;color:var(--text-2);}
.emp-filter-actions button:hover{border-color:var(--accent);color:var(--accent);}
.emp-filter-item{display:flex;align-items:center;gap:7px;padding:6px 6px;border-radius:6px;font-size:12.5px;font-weight:600;cursor:pointer;}
.emp-filter-item:hover{background:var(--accent-dim);}
.emp-filter-item input{width:auto;}
.emp-filter-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

.dayview-scroll{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow-x:auto;overflow-y:auto;height:calc(100vh - 210px);min-height:420px;}
.dayview-grid{display:flex;min-width:600px;}
.time-col{width:56px;flex-shrink:0;border-right:1px solid var(--border);position:sticky;left:0;z-index:20;background:var(--surface);}
.time-col .col-head{height:52px;border-bottom:1px solid var(--border);position:sticky;top:0;left:0;z-index:26;background:var(--surface-2);}
.time-slot-label-abs{position:absolute;right:0;width:56px;text-align:right;padding-right:8px;font-size:var(--font-hour-label,10.5px);color:var(--text-3);font-weight:600;transform:translateY(-50%);background:var(--surface);box-sizing:border-box;}
.time-slot-label-abs.time-slot-end{color:var(--text-2);}
.emp-col{flex:1;min-width:210px;border-right:1px solid var(--border);position:relative;}
.emp-col:last-child{border-right:none;}
.col-head{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid var(--border);gap:2px;padding:6px;background:var(--surface-2);position:sticky;top:0;z-index:25;}
.col-head .name-row{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;}
.col-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-head .ispis-btn{font-size:10px;padding:2px 8px;}
.emp-track{position:relative;}
.emp-track.weekend{background-color:var(--muted-bg);}
.drop-ghost{position:absolute;left:3px;right:3px;border:2px dashed var(--accent);background:var(--accent-dim);border-radius:7px;pointer-events:none;z-index:12;opacity:.9;}
.drop-ghost.copy-mode{border-color:#0066CC;background:#E4EFFF;}
.drop-ghost.copy-mode::after{content:"+";position:absolute;top:-11px;right:-9px;width:20px;height:20px;border-radius:50%;background:#0066CC;color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);}
.drop-ghost-mini{left:2px;right:2px;border-width:1.5px;border-radius:4px;}
.slot-hit{position:absolute;left:0;right:0;height:40px;}
.lunch-band{position:absolute;left:0;right:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(45deg, rgba(154,161,174,.10), rgba(154,161,174,.10) 7px, transparent 7px, transparent 14px);border-top:1px dashed var(--border-strong);border-bottom:1px dashed var(--border-strong);display:flex;align-items:center;justify-content:center;}
.lunch-band .lunch-label{font-size:10.5px;font-weight:700;color:var(--text-3);background:var(--surface);padding:1px 7px;border-radius:20px;border:1px solid var(--border);}
.item-block{position:absolute;left:3px;right:3px;border-radius:8px;padding:7px 9px;overflow:hidden;cursor:grab;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(20,24,38,.08);transition:box-shadow .12s;user-select:none;z-index:3;}
.item-block.has-hover-popup{overflow:visible;}
.item-block:hover{box-shadow:0 8px 20px rgba(20,24,38,.25);z-index:4;}
.item-block.dragging{opacity:.85;z-index:20;box-shadow:var(--shadow-lg);cursor:grabbing;}
.item-block .it-title{font-size:var(--font-task-name,10.5px);font-weight:800;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;align-items:flex-start;gap:3px;}
.it-titletime{font-weight:600;opacity:.85;font-size:var(--font-time-range,9.5px);}
.it-flags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.it-sub{font-size:10.5px;opacity:.95;font-weight:700;margin-top:1px;}
.it-dates{font-size:var(--font-pv-rok,9px);opacity:.9;margin-top:1px;font-weight:700;}
.flag{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.45);color:inherit;text-decoration:none;line-height:1.4;}
.flag-link{background:rgba(255,255,255,.62);text-decoration:none;border:1px solid rgba(255,255,255,.7);}
.flag-link:hover{background:rgba(255,255,255,.9);}
.item-block .note-flag, .item-block .link-flag, .mchip .note-flag, .mchip .link-flag{font-size:12px;text-decoration:none;}
.item-block .link-flag, .mchip .link-flag{cursor:pointer;}
.item-block .it-sub{font-size:10.5px;opacity:.9;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.resize-handle{position:absolute;left:0;right:0;bottom:0;height:14px;cursor:ns-resize;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;z-index:5;}
.resize-handle::after{content:"";width:26px;height:3px;border-radius:3px;background:rgba(0,0,0,.22);opacity:0;transition:opacity .15s,background .15s;}
.item-block:hover .resize-handle::after{opacity:1;}
.resize-handle:hover::after{background:rgba(0,0,0,.4);}
.item-del{position:absolute;top:4px;right:4px;width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);color:#B3261E;opacity:0;transition:opacity .12s;cursor:pointer;z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.item-done-btn{position:absolute;top:4px;right:23px;width:17px;height:17px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);color:#00822F;opacity:0;transition:opacity .12s;cursor:pointer;z-index:4;box-shadow:0 1px 3px rgba(0,0,0,.18);}
.item-block:hover .item-done-btn, .mb-block:hover .item-done-btn{opacity:1;}
.item-done-btn:hover{background:var(--surface);}
.item-block.is-done, .mb-block.is-done{background:var(--muted-bg) !important; opacity:1; border-width:2px; border-color:#00A03B !important;}
.item-block.is-done .it-title, .mb-block.is-done .mbt, .item-block.is-done .it-titletime, .mb-block.is-done .mb-time-inline{color:var(--text-3) !important; text-decoration:line-through;}
.mb-block .item-done-btn{top:2px;right:20px;width:14px;height:14px;}
.item-block:hover .item-del, .mb-block:hover .item-del{opacity:1;}
.item-del:hover{background:var(--surface);}
.mb-block .item-del{top:2px;right:2px;width:14px;height:14px;}
.undo-redo-seg button{display:flex;align-items:center;gap:5px;padding:6px 12px;}
.undo-redo-seg button.is-disabled{opacity:.35;}
.undo-redo-seg button.is-disabled:hover{background:none;}
.resize-handle:after{content:"";position:absolute;left:50%;bottom:2px;width:20px;height:2.5px;border-radius:2px;background:rgba(0,0,0,.25);transform:translateX(-50%);}

.item-block.has-hover-popup{cursor:pointer;}
.hover-popup{display:none;position:absolute;top:0;left:100%;margin-left:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:10px 12px;min-width:190px;max-width:250px;z-index:60;font-size:11.5px;color:var(--text);cursor:default;}
.hover-popup::before{content:"";position:absolute;top:0;bottom:0;left:-8px;width:8px;}
.item-block.popup-left .hover-popup, .mb-block.popup-left .hover-popup{left:auto;right:100%;margin-left:0;margin-right:6px;}
.item-block.popup-left .hover-popup::before, .mb-block.popup-left .hover-popup::before{left:auto;right:-8px;}
.item-block.has-hover-popup:hover, .mb-block.has-hover-popup:hover{z-index:15;}
.item-block.has-hover-popup:hover .hover-popup, .mb-block.has-hover-popup:hover .hover-popup{display:block;}
.hp-title{display:flex;align-items:center;gap:5px;font-weight:800;font-size:12px;margin-bottom:6px;}
.hp-time{font-weight:600;color:var(--text-2);font-size:10.5px;}
.hp-row{margin-bottom:5px;line-height:1.4;color:var(--text-2);}
.hp-note{display:flex;align-items:flex-start;gap:5px;color:var(--text);}
.hp-link{display:flex;align-items:center;gap:5px;color:var(--accent);text-decoration:underline;font-weight:700;margin-top:4px;}
.hp-link:hover{color:var(--accent-ink);}
.hp-link-row{display:flex;align-items:center;gap:6px;margin-top:4px;}
.hp-link-row .hp-link{margin-top:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hp-copy-btn{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);cursor:pointer;}
.hp-copy-btn:hover{background:var(--surface-3,#eee);color:var(--text);}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:8;pointer-events:none;}
.now-line:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red);}

.ctx-menu{position:fixed;background:#1c1e22;border-radius:9px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;min-width:140px;}
.ctx-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:600;padding:8px 10px;border-radius:6px;cursor:pointer;}
.ctx-menu button:hover:not(:disabled){background:rgba(255,255,255,.12);}
.ctx-menu button:disabled{color:rgba(255,255,255,.35);cursor:default;}
.mgrid-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow-x:auto;overflow-y:auto;height:calc(100vh - 210px);min-height:420px;padding:2px;}

/* ---- OVERVIEW VIEW ---- */
:root{ --ov-low:#8FDDAE; --ov-mid:#FFCF5C; --ov-high:#FF9F5A; --ov-over:#F4574A; --ov-vacation:#B9A3E3; }
.ov-wrap{display:flex;height:calc(100vh - 130px);min-height:560px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
.ov-sidebar{width:220px;flex-shrink:0;background:var(--surface-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;}
.ov-sidebar h2{font-size:12px;font-weight:800;color:var(--text-2);margin:0 0 10px;padding:0 2px;}
.ov-emp-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.ov-emp-check{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none;}
.ov-emp-check:hover{background:var(--surface);}
.ov-emp-check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.ov-emp-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.ov-emp-name{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-sidebar-actions{display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.ov-sidebar-actions button{flex:1;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);font-family:inherit;font-size:11px;font-weight:700;padding:6px;border-radius:6px;cursor:pointer;}
.ov-sidebar-actions button:hover{background:var(--border);color:var(--text);}
.ov-main{flex:1;display:flex;flex-direction:column;min-width:0;padding:18px 26px;}
.ov-main-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;}
.ov-month-label{font-size:15px;font-weight:800;}
.ov-month-nav{display:flex;gap:8px;}
.ov-month-nav button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ov-month-nav button:hover{background:var(--surface-2);}
.ov-legend{display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text-2);margin-bottom:12px;flex-shrink:0;flex-wrap:wrap;}
.ov-legend-item{display:flex;align-items:center;gap:5px;}
.ov-sw{width:11px;height:11px;border-radius:3px;display:inline-block;}
.ov-board{flex:1;display:flex;flex-direction:column;min-height:0;}
.ov-header{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;flex-shrink:0;padding-left:150px;}
.ov-wk-row{display:grid;gap:3px;}
.ov-wk{text-align:center;font-size:10px;font-weight:800;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-dow-row{display:grid;gap:3px;}
.ov-dow{text-align:center;font-size:9.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.3px;}
.ov-rows{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0;overflow-y:auto;}
.ov-emp-row{flex:1;display:flex;align-items:stretch;min-height:36px;}
.ov-label{width:150px;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;padding-left:6px;border-left:3px solid transparent;}
.ov-name{font-weight:700;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-daystrip{flex:1;display:grid;gap:3px;min-width:0;}

// pri pisanju u localStorage, ili ga tiho ograničiti. Svaki pristup je zato zaštićen try/catchem, a
// kolačić se tretira kao ravnopravan (ne samo rezervni) izvor - Safari puno pouzdanije čuva prvostrane
// kolačiće nego localStorage u takvim uvjetima.
function safeLsGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeLsSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
function safeLsRemove(key){ try{ localStorage.removeItem(key); }catch(e){} }
function getCookie(name){
  try{
    const m = document.cookie.match(new RegExp("(?:^|; )"+name+"=([^;]*)"));
    return m ? decodeURIComponent(m[1]) : null;
  }catch(e){ return null; }
}
function setCookie(name, value, days){
  try{
    const expires = new Date(Date.now()+days*24*60*60*1000).toUTCString();
    const secure = location.protocol==="https:" ? "; Secure" : "";
    document.cookie = name+"="+encodeURIComponent(value)+"; expires="+expires+"; path=/; SameSite=Lax"+secure;
  }catch(e){}
}
function setPersistentAuth(initials){
  safeLsSet(AUTH_KEY,"1");
  safeLsSet(INITIALS_KEY, initials);
  setCookie("raspored_auth_v1","1",365);
  setCookie("raspored_initials_v1",initials,365);
}
function clearPersistentAuth(){
  safeLsRemove(AUTH_KEY);
  safeLsRemove(INITIALS_KEY);
  try{ document.cookie = "raspored_auth_v1=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;"; }catch(e){}

function getPersistentAuth(){
  const lsInit = safeLsGet(INITIALS_KEY);

/* =========================================================
   HOLIDAYS (Croatia)
   ========================================================= */
function easterSunday(year){
  const a=year%19,b=Math.floor(year/100),c=year%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451),month=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;
  return new Date(year,month-1,day);
}
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function fmtISO(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const holidayCache = {};
function getHolidays(year){
  if(holidayCache[year]) return holidayCache[year];
  const easter = easterSunday(year); const map = {};
  const fixed = [[0,1,"Nova godina"],[0,6,"Bogojavljenje"],[4,1,"Praznik rada"],[5,22,"Dan antifašističke borbe"],[5,25,"Dan državnosti"],[7,5,"Dan pobjede i domovinske zahvalnosti"],[7,15,"Velika Gospa"],[10,1,"Svi sveti"],[10,18,"Dan sjećanja - Vukovar"],[11,25,"Božić"],[11,26,"Sveti Stjepan"]];
  fixed.forEach(([m,d,name])=>{ map[fmtISO(new Date(year,m,d))] = name; });
  map[fmtISO(easter)]="Uskrs"; map[fmtISO(addDays(easter,1))]="Uskrsni ponedjeljak"; map[fmtISO(addDays(easter,60))]="Tijelovo";
  holidayCache[year]=map; return map;
}
function holidayName(dateISO){ return getHolidays(parseInt(dateISO.slice(0,4)))[dateISO] || null; }
function isWeekend(dateISO){ const wd = new Date(dateISO+"T00:00:00").getDay(); return wd===0||wd===6; }

function timeToMinutes(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function minutesToTime(min){ const h=Math.floor(min/60),m=min%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function minutesToHM(min){ const h=Math.floor(min/60),m=min%60; return m===0? h+"h" : h+"h "+m+"m"; }
function todayISO(){ return fmtISO(new Date()); }
async function sha256hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

/* =========================================================

async function sb(path, opts={}){
  const headers = Object.assign({
    "apikey": SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json",
  }, opts.headers||{});
  if(opts.method && opts.method!=="GET") headers["Content-Profile"] = SB_SCHEMA; else headers["Accept-Profile"] = SB_SCHEMA;
  let res;
  try{ res = await fetch(SB_URL+"/rest/v1"+path, Object.assign({}, opts, {headers})); }
  catch(e){ throw new Error("Mrežna greška: "+e.message); }
  if(!res.ok){
    let msg = res.status+" "+res.statusText;
    try{ const j = await res.json(); if(j.message) msg = j.message; }catch(e){}
    throw new Error(msg);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* id-alias mapping: kad se undo/redo ciklusom stavka ponovno stvori, Supabase joj dodijeli NOVI id.
   Ovo prati "lanac" da svaki povijesni zapis uvijek zna stvarni trenutni id stavke na koju se odnosi. */
const idAliases = {};
function resolveId(id){ let cur=id; const seen=new Set(); while(idAliases[cur]!==undefined && !seen.has(cur)){ seen.add(cur); cur=idAliases[cur]; } return cur; }
function setIdAlias(oldId,newId){ if(oldId!==newId) idAliases[oldId]=newId; }

let currentBatch = null; // dok je aktivan, pojedinačni undo/redo zapisi se skupljaju u JEDNU logičku radnju
function combineEntries(label, entries){
  return { label,
    undo: async ()=>{ for(let i=entries.length-1;i>=0;i--){ await entries[i].undo(); } },
    redo: async ()=>{ for(let i=0;i<entries.length;i++){ await entries[i].redo(); } } };
}
function recordHistoryEntry(entry){
  if(currentBatch){ currentBatch.push(entry); return; }
  pushHistory(entry);
}
async function withUndoBatch(label, fn){
  const entries = [];
  const prevBatch = currentBatch;
  currentBatch = entries;
  try{ await fn(); } finally { currentBatch = prevBatch; }
  if(entries.length===1) pushHistory(entries[0]);
  else if(entries.length>1) pushHistory(combineEntries(label, entries));
}
function pushHistory(entry){
  state.undoStack.push(entry);
  if(state.undoStack.length > MAX_UNDO) state.undoStack.shift();
  state.redoStack = []; // nova radnja briše "redo" granu
}
async function undo(){
  if(!state.undoStack.length) return;
  const entry = state.undoStack.pop();
  try{
    await entry.undo();
    state.redoStack.push(entry);
    if(state.redoStack.length > MAX_UNDO) state.redoStack.shift();
    showToast("Poništeno: "+entry.label);
  }catch(e){ showToast("Greška kod poništavanja: "+e.message); }
  render();
}
async function redo(){
  if(!state.redoStack.length) return;
  const entry = state.redoStack.pop();
  try{
    await entry.redo();
    state.undoStack.push(entry);
    if(state.undoStack.length > MAX_UNDO) state.undoStack.shift();
    showToast("Ponovljeno: "+entry.label);
  }catch(e){ showToast("Greška kod ponavljanja: "+e.message); }
  render();
}
const Items = {
  listRange: async (start,end)=> {
    const rows = await sb("/schedule_items?select=*&item_date=gte."+start+"&item_date=lte."+end+"&order=item_date.asc,start_time.asc");
    return (rows||[]).map(normalizeItemRow);
  },
  create: async (d)=> {
    const res = await sb("/schedule_items", {method:"POST", headers:{Prefer:"return=representation"}, body:JSON.stringify(d)});
    const row = Array.isArray(res)?res[0]:res;
    const norm = normalizeItemRow(row);
    const originId = norm.id;
    recordHistoryEntry({
      label: "dodavanje",
      undo: async ()=>{
        const curId = resolveId(originId);
        await sb("/schedule_items?id=eq."+curId, {method:"DELETE"});
        state.items = state.items.filter(x=>x.id!==curId);
      },
      redo: async ()=>{
        const res2 = await sb("/schedule_items", {method:"POST", headers:{Prefer:"return=representation"}, body:JSON.stringify(d)});
        const row2 = normalizeItemRow(Array.isArray(res2)?res2[0]:res2);
        setIdAlias(resolveId(originId), row2.id);
        state.items.push(row2);
      },
    });
    return norm;
  },
  update: async (id,d)=> {
    const realId = resolveId(id);
    const prev = state.items.find(x=>x.id===realId);
    const prevData = prev ? itemDataFields(prev) : null;
    const res = await sb("/schedule_items?id=eq."+realId, {method:"PATCH", headers:{Prefer:"return=representation"}, body:JSON.stringify(d)});
    const row = Array.isArray(res)?res[0]:res;
    const norm = normalizeItemRow(row);
    if(prevData){
      recordHistoryEntry({
        label: "izmjena",
        undo: async ()=>{
          const curId = resolveId(realId);
          const res2 = await sb("/schedule_items?id=eq."+curId, {method:"PATCH", headers:{Prefer:"return=representation"}, body:JSON.stringify(prevData)});
          const row2 = normalizeItemRow(Array.isArray(res2)?res2[0]:res2);
          const idx = state.items.findIndex(x=>x.id===curId);
          if(idx>-1) state.items[idx] = row2;
        },
        redo: async ()=>{
          const curId = resolveId(realId);
          const res2 = await sb("/schedule_items?id=eq."+curId, {method:"PATCH", headers:{Prefer:"return=representation"}, body:JSON.stringify(d)});
          const row2 = normalizeItemRow(Array.isArray(res2)?res2[0]:res2);
          const idx = state.items.findIndex(x=>x.id===curId);
          if(idx>-1) state.items[idx] = row2;
        },
      });
    }
    return norm;
  },
  remove: async (id)=> {
    const realId = resolveId(id);
    const prev = state.items.find(x=>x.id===realId);
    await sb("/schedule_items?id=eq."+realId, {method:"DELETE"});
    state.items = state.items.filter(x=>x.id!==realId);
    if(prev){
      const prevData = itemDataFields(prev);
      const originId = realId;
      recordHistoryEntry({
        label: "brisanje",
        undo: async ()=>{
          const res2 = await sb("/schedule_items", {method:"POST", headers:{Prefer:"return=representation"}, body:JSON.stringify(prevData)});
          const row2 = normalizeItemRow(Array.isArray(res2)?res2[0]:res2);
          setIdAlias(resolveId(originId), row2.id);
          state.items.push(row2);
        },
        redo: async ()=>{
          const curId = resolveId(originId);
          await sb("/schedule_items?id=eq."+curId, {method:"DELETE"});
          state.items = state.items.filter(x=>x.id!==curId);
        },
      });
    }
  },
};
/* Zajednička logika pauze za ručak (12:00-13:00) - koristi je i modal za spremanje i drag/resize
   na gridu, da se ponašanje ne razlikuje ovisno o tome kako korisnik promijeni vrijeme taska. */
function computeLunchSplit(itemType, startTime, durationMinutes){
  const isTaskLike = (itemType==="task" || itemType==="internal_dev");
  const startMin = timeToMinutes(startTime);
  const D = durationMinutes;
  const overlapsLunch = isTaskLike && startMin < LUNCH_END_MIN && (startMin+D) > LUNCH_START_MIN;
  if(!overlapsLunch) return null;
  const preLunchAvailable = Math.max(0, LUNCH_START_MIN-startMin);
  const seg1Duration = Math.min(D, preLunchAvailable);
  let remainingDuration = D - seg1Duration;
  // dio poslije pauze nikad ne smije prijeći kraj radnog dana (17:00) - inače task "iscuri" izvan rasporeda
  const maxSeg2Duration = Math.max(SLOT_MIN, GRID_END_MIN - LUNCH_END_MIN);
  const truncated = remainingDuration > maxSeg2Duration;
  if(truncated) remainingDuration = maxSeg2Duration;
  if(seg1Duration>0){
    return { splitInTwo:true, truncated,
      seg1:{ start_time:startTime, duration_minutes:seg1Duration },
      seg2:{ start_time:minutesToTime(LUNCH_END_MIN), duration_minutes:remainingDuration } };
  }
  return { splitInTwo:false, truncated,
    shifted:{ start_time:minutesToTime(LUNCH_END_MIN), duration_minutes:remainingDuration } };
}
// Za drag/resize/Alt-kopiju: korisnik VIDI gdje ispusta blok, pa ako taj raspon prelazi pauzu,
// samo se izreze dio koji upada u pauzu (12-13h) - kraj OSTAJE ondje gdje je fizicki odvucen,
// ne produzuje se dalje (za razliku od computeLunchSplit koji cuva puno trajanje).
function computeLunchTrim(itemType, startTime, durationMinutes){
  const isTaskLike = (itemType==="task" || itemType==="internal_dev");
  const startMin = timeToMinutes(startTime);
  const endMin = startMin + durationMinutes;
  const overlapsLunch = isTaskLike && startMin < LUNCH_END_MIN && endMin > LUNCH_START_MIN;
  if(!overlapsLunch) return null;
  const seg1Start = startMin, seg1End = Math.min(endMin, LUNCH_START_MIN);
  const seg2Start = Math.max(startMin, LUNCH_END_MIN), seg2End = endMin;
  const seg1Valid = seg1End > seg1Start;
  const seg2Valid = seg2End > seg2Start;
  if(seg1Valid && seg2Valid){
    return { splitInTwo:true,
      seg1:{ start_time:startTime, duration_minutes:seg1End-seg1Start },
      seg2:{ start_time:minutesToTime(LUNCH_END_MIN), duration_minutes:seg2End-seg2Start } };
  }
  if(seg1Valid){ // zavrsava tijekom/prije pauze - skraceno na kraj prije pauze
    return { splitInTwo:false, shifted:{ start_time:startTime, duration_minutes:seg1End-seg1Start } };
  }
  if(seg2Valid){ // pocinje tijekom pauze - ostaje isti kraj, pocetak pomaknut na 13:00
    return { splitInTwo:false, shifted:{ start_time:minutesToTime(LUNCH_END_MIN), duration_minutes:seg2End-seg2Start } };
  }
  // cijeli raspon je unutar pauze - minimalni prikaz odmah nakon pauze
  return { splitInTwo:false, shifted:{ start_time:minutesToTime(LUNCH_END_MIN), duration_minutes:SLOT_MIN } };
}
// MOVE (pomicanje cijelog bloka): ako novo mjesto pocinje UNUTAR neke druge obaveze (task ili pauza),
// pomakni pocetak na kraj te obaveze (moze se ponoviti kroz vise obaveza zaredom). Nakon toga, skrati kraj
// ako udari u SLJEDECU obavezu, i ogranici na dnevni limit od 7h. "capped" govori pozivatelju treba li
// prikazati poruku o kvoti (za razliku od obicnog pomicanja zbog zauzeca).
function trimAgainstOthersAndDailyCap(itemType, startTime, durationMinutes, employeeId, dateISO, excludeId){
  const isTaskLike = (itemType==="task" || itemType==="internal_dev");
  if(!isTaskLike) return { start_time:startTime, duration_minutes:durationMinutes, changed:false, capped:false };
  const others = occupiedIntervals(employeeId, dateISO, excludeId, true); // ukljucuje i pauzu za rucak
  let startMin = timeToMinutes(startTime);
  let shifted = false;
  let guard = 0;
  while(guard++<20){
    const containing = others.find(iv=>startMin>=iv.start && startMin<iv.end);
    if(!containing) break;
    startMin = containing.end;
    shifted = true;
  }
  let endMin = startMin + durationMinutes;
  others.forEach(iv=>{ if(iv.start>=startMin && iv.start<endMin) endMin = Math.min(endMin, iv.start); });
  endMin = Math.min(endMin, GRID_END_MIN);
  const usedElsewhere = employeeDayMinutes(employeeId, dateISO, excludeId);
  const remainingCap = Math.max(0, DAILY_CAP_MIN - usedElsewhere);
  const maxEndByCapacity = startMin + remainingCap;
  let capped = false;
  if(endMin > maxEndByCapacity){ endMin = maxEndByCapacity; capped = true; }
  const finalDuration = Math.max(SLOT_MIN, endMin - startMin);
  const changed = shifted || capped || finalDuration!==durationMinutes || minutesToTime(startMin)!==startTime;
  return { start_time:minutesToTime(startMin), duration_minutes:finalDuration, changed, capped };
}
// RESIZE (produljivanje): ne pomice pocetak niti produzuje dalje od mjesta do kojeg je fizicki povuceno -
// samo "izreze" dijelove koji upadaju u postojece obaveze (task ili pauza) unutar tog dovucenog raspona,
// isto nacelo kao sto vec radi pauza za rucak, samo prosireno na SVE obaveze, ne samo pauzu.
function computeResizeSplit(itemType, startTime, durationMinutes, employeeId, dateISO, excludeId){
  const isTaskLike = (itemType==="task" || itemType==="internal_dev");
  if(!isTaskLike) return null;
  const startMin = timeToMinutes(startTime);
  const endMin = startMin + durationMinutes; // fiksno - ovo je tocno mjesto do kojeg je povuceno
  const occupied = occupiedIntervals(employeeId, dateISO, excludeId, true);
  const relevant = occupied.filter(iv=>iv.end>startMin && iv.start<endMin).sort((a,b)=>a.start-b.start);
  if(!relevant.length) return null; // nema preklapanja - sprema se normalno, bez izmjene
  const segments = [];
  let cursor = startMin;
  for(const iv of relevant){
    if(iv.start > cursor) segments.push({ start_time:minutesToTime(cursor), duration_minutes: iv.start-cursor });
    cursor = Math.max(cursor, iv.end);
  }
  if(cursor < endMin) segments.push({ start_time:minutesToTime(cursor), duration_minutes: endMin-cursor });
  const valid = segments.filter(s=>s.duration_minutes>0);
  if(!valid.length) return null;
  if(valid.length===1 && valid[0].start_time===startTime && valid[0].duration_minutes===durationMinutes) return null;
  return valid;
}
// Nakon racunanja segmenata (resize split), jos ih ogranici na preostali dnevni kapacitet od 7h -
// odbacuje/skraćuje segmente od kraja prema pocetku dok ukupno ne stane.
function capSegmentsToDaily(segments, employeeId, dateISO, excludeId){
  const usedElsewhere = employeeDayMinutes(employeeId, dateISO, excludeId);
  let remaining = Math.max(0, DAILY_CAP_MIN - usedElsewhere);
  const result = [];
  for(const seg of segments){
    if(remaining<=0) break;
    const dur = Math.min(seg.duration_minutes, remaining);
    if(dur>0){ result.push({ start_time:seg.start_time, duration_minutes:dur }); remaining -= dur; }
  }
  return result.length ? result : [ { start_time:segments[0].start_time, duration_minutes:SLOT_MIN } ];
}
// Primjenjuje promjenu na postojeću stavku (drag/resize). mode="resize" prelama oko prepreka (fiksan
// kraj, kao pauza za rucak, prosireno na sve obaveze). mode="move" (zadano) pomice pocetak iza prepreke
// i upozorava ako se prelazi dnevni limit od 7h.
async function applyChangeWithLunchSplit(item, extraPayload, mode){
  const newStart = extraPayload.start_time || item.start_time;
  const newDuration = extraPayload.duration_minutes || item.duration_minutes;
  const empId = extraPayload.employee_id || item.employee_id;
  const dateISO = extraPayload.item_date || item.item_date;

  if(mode==="resize"){
    const segments = computeResizeSplit(item.item_type, newStart, newDuration, empId, dateISO, item.id);
    if(!segments){
      const row = await Items.update(item.id, extraPayload);
      const idx = state.items.findIndex(x=>x.id===item.id);
      if(idx>-1) state.items[idx] = row;
      return;
    }
    const capped = capSegmentsToDaily(segments, empId, dateISO, item.id);
    if(capped.length===1){
      const payload = Object.assign({}, extraPayload, capped[0]);
      const row = await Items.update(item.id, payload);
      const idx = state.items.findIndex(x=>x.id===item.id);
      if(idx>-1) state.items[idx] = row;
      showToast("Prilagođeno postojećoj obavezi u tom razdoblju.");
      return;
    }
    await withUndoBatch("razdvajanje kod produljivanja", async ()=>{
      const payload1 = Object.assign({}, extraPayload, capped[0]);
      const row1 = await Items.update(item.id, payload1);
      const idx = state.items.findIndex(x=>x.id===item.id);
      if(idx>-1) state.items[idx] = row1;
      for(let i=1;i<capped.length;i++){
        const row = await Items.create(Object.assign({}, itemDataFields(item), extraPayload, capped[i]));
        state.items.push(row);
      }
    });
    showToast("Task ide preko postojeće obaveze — razdvojen u "+capped.length+" dijela, do mjesta do kojeg je povučeno.");
    return;
  }

  // MOVE (zadano)
  const extra = trimAgainstOthersAndDailyCap(item.item_type, newStart, newDuration, empId, dateISO, item.id);
  const payload = Object.assign({}, extraPayload, {start_time:extra.start_time, duration_minutes:extra.duration_minutes});
  const row = await Items.update(item.id, payload);
  const idx = state.items.findIndex(x=>x.id===item.id);
  if(idx>-1) state.items[idx] = row;
  if(extra.capped) showToast("Task prelazi dnevnu kvotu od 7h za taj dan — skraćen na "+minutesToHM(extra.duration_minutes)+".");
  else if(extra.changed) showToast("Pomaknuto na "+extra.start_time+" — tamo je bilo zauzeto.");
}

// Racuna zaposlenika/datum/vrijeme ispod dane tocke na ekranu, za dan i tjedan/3-dana prikaz.
// Koristi se za desni klik na prazno mjesto i za hover-pracenje (Ctrl+V cilja).
function getSlotTargetAtPoint(clientX, clientY){
  const el = document.elementFromPoint(clientX, clientY);
  if(!el) return null;
  const hit = el.closest(".slot-hit");
  if(hit) return { employeeId: hit.dataset.emp, dateISO: hit.dataset.date, startTime: hit.dataset.time };
  const board = el.closest(".mboard");
  if(board){
    const rect = board.getBoundingClientRect();
    const pad = parseInt(board.dataset.pad||"0");
    const relY = clientY - rect.top - pad;
    const slotPx = parseInt(board.dataset.slotpx);
    const pxPerMin = slotPx/30;
    let minuteOffset = Math.round((relY/pxPerMin)/SLOT_MIN)*SLOT_MIN;
    minuteOffset = Math.max(0, Math.min(540-SLOT_MIN, minuteOffset));
    return { employeeId: board.dataset.emp, dateISO: board.dataset.date, startTime: minutesToTime(GRID_START_MIN+minuteOffset) };
  }
  return null;
}

// Jednokratna migracija: postojeci zaposlenici imaju boje iz stare, zasicenije palete.
// Ovo ih tiho prebacuje na novu pastelnu paletu (svakome razlicitu boju, po redu).
async function migratePastelColors(){
  const OLD_EMP_COLORS = ["#00A03B","#3C7E79","#005670","#AA198D","#8FB52E","#2C5F5C","#00822F","#6B1F5C"];
  const toMigrate = state.employees.filter(e => !EMP_COLORS.includes(e.color) || OLD_EMP_COLORS.includes(e.color));
  if(!toMigrate.length) return;
  const usedPastels = new Set(state.employees.map(e=>e.color).filter(c=>EMP_COLORS.includes(c)));
  let nextIdx = 0;
  for(const emp of toMigrate){
    let color = EMP_COLORS[nextIdx % EMP_COLORS.length];
    let guard = 0;
    while(usedPastels.has(color) && guard < EMP_COLORS.length){ nextIdx++; color = EMP_COLORS[nextIdx % EMP_COLORS.length]; guard++; }
    usedPastels.add(color); nextIdx++;
    try{ await Employees.update(emp.id, {color}); emp.color = color; }catch(e){}
  }
}

    state._itemsSnapshot = freshStr;
    refreshScheduleArea(); // scroll position is preserved automatically inside this
    newItems.forEach(it=>checkAndNotifyForItem(it));
  }catch(e){ /* silent - next tick retries */ }
}
// Obavijesti: provjerava li se NOVI unos odnosi bas na OSOBU koja sjedi za ovim uredjajem (po inicijalima
// zaposlenika kojem je task dodijeljen). Buduci da vlastiti unosi vec postoje u state.items PRIJE ovog tick-a
// (jer smo ih sami push-ali odmah nakon spremanja), ovaj provjera se prirodno NIKAD ne okine za vlastiti unos -
// samo kad NETKO DRUGI doda nesto sto se tice mene.
async function checkAndNotifyForItem(item){
  if(!state.myInitials) return;
  const emp = state.employees.find(e=>e.id===item.employee_id);
  if(!emp || !emp.initials) return;
  if(emp.initials.toUpperCase() !== state.myInitials.toUpperCase()) return;
  const label = item.item_type==="vacation" ? "Godišnji odmor" : (item.task_number || (TYPE_META[item.item_type]?TYPE_META[item.item_type].label:"Stavka"));
  const msg = label+" — "+fmtDateHR(item.item_date)+", "+item.start_time;
  await addNotification(msg, item.id);
  maybePlayCreationSound();
  maybeSendDesktopNotification("Novo u rasporedu", msg);
}
async function addNotification(message, itemId){
  try{
    const row = await sb("/notifications", {method:"POST", headers:{Prefer:"return=representation"}, body:JSON.stringify({
      target_initials: state.myInitials.toUpperCase(), message, item_id: itemId||null,
    })});
    const created = Array.isArray(row)?row[0]:row;
    if(created){ state.notifications.unshift(created); state.notificationsUnread++; }
    refreshTopbar();
  }catch(e){ console.error("Greška kod spremanja obavijesti:", e); }
}
async function loadNotifications(){
  if(!state.myInitials) return;
  try{
    await sb("/notifications?target_initials=eq."+encodeURIComponent(state.myInitials.toUpperCase())+"&created_at=lt."+encodeURIComponent(new Date(Date.now()-14*24*60*60*1000).toISOString()), {method:"DELETE"});
    const rows = await sb("/notifications?target_initials=eq."+encodeURIComponent(state.myInitials.toUpperCase())+"&order=created_at.desc&limit=100");
    state.notifications = rows||[];
    state.notificationsUnread = state.notifications.filter(n=>!n.read).length;
  }catch(e){ console.error("Greška kod dohvata obavijesti:", e); }
}
async function markNotificationsRead(){
  const unread = state.notifications.filter(n=>!n.read);
  if(!unread.length) return;
  state.notifications.forEach(n=>n.read=true);
  state.notificationsUnread = 0;
  try{ await sb("/notifications?target_initials=eq."+encodeURIComponent(state.myInitials.toUpperCase())+"&read=eq.false", {method:"PATCH", body:JSON.stringify({read:true})}); }
  catch(e){ /* tiho - stanje je vec azurirano lokalno */ }
}
function refreshTopbar(){
  const el = document.getElementById("topbarWrap");
  if(!el){ render(); return; }
  el.outerHTML = renderTopbar();
}
function startLiveRefresh(){
  if(liveRefreshTimer) return;
  liveRefreshTimer = setInterval(liveRefreshTick, 6000);
}
function stopLiveRefresh(){ if(liveRefreshTimer){ clearInterval(liveRefreshTimer); liveRefreshTimer=null; } }

function getInitialsFromUrl(){
  try{
    const params = new URLSearchParams(location.search);
    const u = (params.get("u")||"").trim().toUpperCase().slice(0,4);
    return u || null;
  }catch(e){ return null; }
}
function toggleTheme(){
  const next = document.documentElement.dataset.theme==="dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  state.theme = next;
  try{ localStorage.setItem("raspored_theme_v1", next); }catch(e){}
  render();
}
async function boot(){
  state.theme = document.documentElement.dataset.theme || "light";
  const urlInitials = getInitialsFromUrl();
  const { savedInitials } = getPersistentAuth();
  state.authed = true;
  // URL parametar (?u=XX) je imun na čišćenje localStorage/kolačića (npr. korporativni proxy, Chrome politike)
  // pa ima prednost ako postoji - i odmah se sinkronizira natrag u storage za slučaj da storage ipak radi.
  state.myInitials = urlInitials || savedInitials || null;
  state.pinSelfToTop = safeLsGet(PIN_SELF_KEY) === "1";
  state.desktopNotifsEnabled = safeLsGet(DESKTOP_NOTIF_KEY) === "1";
  if(state.myInitials){ setPersistentAuth(state.myInitials); updateUrlInitials(state.myInitials); }
  await bootDataWithRetry();
  await loadNotifications();
  state.loading = false;
  render();
}
async function bootDataWithRetry(attempt){
  attempt = attempt || 1;
  try{
    await init();
    await heartbeat();
    startPresencePolling(); startLiveRefresh();
  }catch(e){
    if(attempt < 3){
      await new Promise(r=>setTimeout(r, 700*attempt));
      return bootDataWithRetry(attempt+1);
    }
    showToast("Greška kod učitavanja podataka: "+e.message+" — pokušaj osvježiti stranicu.");
  }
}
function updateUrlInitials(val){
  try{
    const url = new URL(location.href);
    if(val) url.searchParams.set("u", val); else url.searchParams.delete("u");
    history.replaceState(null, "", url.toString());
  }catch(e){}
}
async function saveMyInitials(){
  const el = document.getElementById("myInitialsInput");
  const val = (el.value||"").trim().toUpperCase().slice(0,4);
  const pin = document.getElementById("pinSelfToggle").checked;
  state.pinSelfToTop = pin;
  safeLsSet(PIN_SELF_KEY, pin ? "1" : "0");
  const notifToggleEl = document.getElementById("desktopNotifToggle");
  if(notifToggleEl){
    state.desktopNotifsEnabled = notifToggleEl.checked;
    safeLsSet(DESKTOP_NOTIF_KEY, notifToggleEl.checked ? "1" : "0");
  }
  if(val){
    setPersistentAuth(val); state.myInitials = val; updateUrlInitials(val);
    if(!presenceTimer){ heartbeat(); startPresencePolling(); }
    await loadNotifications();
    showToast("Inicijali spremljeni. Spremi ovaj link kao bookmark za najpouzdanije pamćenje.");
  }
  state.initialsPickerOpen = false;
  render();
}
function clearMyInitials(){
  clearPersistentAuth();
  state.myInitials = null;
  updateUrlInitials(null);
  state.initialsPickerOpen = false;
  render();
}

/* ---- presence (who's online) ---- */
let presenceTimer = null;
async function heartbeat(){
  if(!state.myInitials) return;
  try{ await sb("/sessions?on_conflict=initials", {method:"POST", headers:{Prefer:"resolution=merge-duplicates"}, body:JSON.stringify({initials:state.myInitials, last_seen:new Date().toISOString()})}); }
  catch(e){ /* silent */ }
}
async function refreshActiveSessions(){
  try{
    const cutoff = new Date(Date.now()-90*1000).toISOString();
    const rows = await sb("/sessions?select=initials,last_seen&last_seen=gte."+cutoff);
    state.activeSessions = rows||[];
    renderPresenceOnly();
  }catch(e){ /* silent */ }
}
function startPresencePolling(){
  if(presenceTimer) return;
  refreshActiveSessions();
  presenceTimer = setInterval(()=>{ heartbeat(); refreshActiveSessions(); }, 30000);
}
function stopPresencePolling(){ if(presenceTimer){ clearInterval(presenceTimer); presenceTimer=null; } }
function initialsForEmployee(emp){
  const parts = emp.name.trim().split(/\s+/);
  return (parts.length>1 ? parts[0][0]+parts[parts.length-1][0] : parts[0].slice(0,2)).toUpperCase();
}
function colorForInitials(initials){
  const match = state.employees.find(e=>initialsForEmployee(e)===initials);
  if(match) return match.color;
  let hash=0; for(const c of initials) hash = c.charCodeAt(0)+((hash<<5)-hash);
  const palette = ["#6B7280","#8FB52E","#2C5F5C","#B45309","#6B1F5C"];
  return palette[Math.abs(hash)%palette.length];
}
function renderPresenceOnly(){
  const el = document.getElementById("presenceRow");
  if(el) el.outerHTML = renderPresenceRow();
}
function renderNotificationBell(){
  const list = state.notifications||[];
  const shown = state.notificationHistoryOpen ? list : list.slice(0,5);
  return `<div style="position:relative;">
    <button class="btn btn-ghost" data-act="toggle-notification-bell" title="Obavijesti" style="position:relative;">
      ${icon('bell',16)}
      ${state.notificationsUnread>0 ? `<span class="notif-badge">${state.notificationsUnread>9?"9+":state.notificationsUnread}</span>` : ""}
    </button>
    ${state.notificationBellOpen ? `<div class="notif-popover" data-stop="1">
      <div class="notif-popover-head">Obavijesti</div>
      ${!list.length ? `<p style="font-size:12px;color:var(--text-3);padding:10px 12px;">Nema obavijesti u zadnjih 14 dana.</p>` : `
        <div class="notif-list">
          ${shown.map(n=>`<div class="notif-row ${n.read?'':'notif-unread'}">
            <div class="notif-msg">${escapeHtml(n.message)}</div>
            <div class="notif-time">${notifRelativeTime(n.created_at)}</div>
          </div>`).join("")}
        </div>
        ${list.length>5 ? `<button class="btn btn-ghost btn-sm" data-act="toggle-notification-history" style="width:100%;margin-top:4px;">${state.notificationHistoryOpen?"Prikaži manje":"Prikaži sve ("+list.length+")"}</button>` : ""}
      `}
    </div>` : ""}
  </div>`;
}
function notifRelativeTime(iso){
  const diffMin = Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(diffMin<1) return "upravo sad";
  if(diffMin<60) return diffMin+" min";
  const diffH = Math.round(diffMin/60);
  if(diffH<24) return diffH+" h";
  const diffD = Math.round(diffH/24);
  return diffD+" d";
}
function renderPresenceRow(){
  const list = state.activeSessions||[];
  if(!list.length) return `<div class="presence-row" id="presenceRow"></div>`;
  return `<div class="presence-row" id="presenceRow">
    ${list.map(s=>`<div class="presence-avatar" style="background:${colorForInitials(s.initials)}" title="${escapeHtml(s.initials)} — aktivno">${escapeHtml(s.initials)}</div>`).join("")}
  </div>`;
}

function showToast(msg){

function captureScroll(){
  const el = document.querySelector(".mgrid-wrap") || document.querySelector(".dayview-scroll");
  return { top: el?el.scrollTop:0, left: el?el.scrollLeft:0, winY: window.scrollY };

function restoreScroll(snap){
  const el = document.querySelector(".mgrid-wrap") || document.querySelector(".dayview-scroll");
  if(el){ el.scrollTop = snap.top; el.scrollLeft = snap.left; }
  window.scrollTo(0, snap.winY);

  const app = document.getElementById("app");

  const snap = captureScroll();
  app.innerHTML = `

}
function escapeHtml(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sortPinnedFirst(emps){
  if(!state.pinSelfToTop || !state.myInitials) return emps;
  const mine = emps.find(e=>(e.initials||"").toUpperCase()===state.myInitials.toUpperCase());
  if(!mine) return emps;
  return [mine, ...emps.filter(e=>e.id!==mine.id)];
}

   DAY VIEW (employees as columns, precise grid)

function renderDayView(){
  const dateISO = state.currentDate;
  const weekend = isWeekend(dateISO);
  const activeEmps = sortPinnedFirst(state.employees.filter(e=>e.active && !state.hiddenEmployeeIds.has(e.id)));
  const dayItems = state.items.filter(it=>it.item_date===dateISO);

  if(activeEmps.length===0){
    return `<div class="empty-state"><h3>Nema vidljivih zaposlenika</h3><p>Dodaj zaposlenike ili isključi filter iznad.</p></div>`;
  }

  const dayPxPerMin = state.settings.row_px_day/30;
  const gridInner = (GRID_END_MIN-GRID_START_MIN)*dayPxPerMin;
  const PAD_TOP = 16, PAD_BOTTOM = 16;
  const totalHeight = gridInner + PAD_TOP + PAD_BOTTOM;
  const nowMin = (()=>{ const n=new Date(); return n.getHours()*60+n.getMinutes(); })();
  const showNow = dateISO===todayISO() && nowMin>=GRID_START_MIN && nowMin<=GRID_END_MIN;
  const nowTop = PAD_TOP + (nowMin-GRID_START_MIN)*dayPxPerMin;

  const HEAD_H = 52;
  const timeLabels = DISPLAY_TIME_MARKS.map(t=>`<div class="time-slot-label-abs" style="top:${HEAD_H+PAD_TOP+(timeToMinutes(t)-GRID_START_MIN)*dayPxPerMin}px">${t}</div>`).join("")
    + `<div class="time-slot-label-abs time-slot-end" style="top:${HEAD_H+PAD_TOP+gridInner}px">17:00</div>`;

  let gridStops = [`transparent ${PAD_TOP}px`];
  DISPLAY_TIME_MARKS.forEach(t=>{
    const y = PAD_TOP + (timeToMinutes(t)-GRID_START_MIN)*dayPxPerMin;
    gridStops.push(`transparent ${y}px`, `var(--border) ${y}px`, `var(--border) ${y+1}px`, `transparent ${y+1}px`);
  });
  const gridBg = `linear-gradient(to bottom, ${gridStops.join(",")})`;
  const daySlotPx = SLOT_MIN*dayPxPerMin;

  const empCols = activeEmps.map((emp,idx)=>{
    const items = dayItems.filter(it=>it.employee_id===emp.id).sort((a,b)=>timeToMinutes(a.start_time)-timeToMinutes(b.start_time));
    const blocks = items.map(it=>renderItemBlock(it, dayPxPerMin, PAD_TOP, idx===activeEmps.length-1)).join("");
    const hits = TIME_SLOTS.map((t,i)=>`<div class="slot-hit" style="top:${PAD_TOP+i*daySlotPx}px;height:${daySlotPx}px" data-act="add-item-slot" data-emp="${emp.id}" data-time="${t}" data-date="${dateISO}"></div>`).join("");
    const lunchLabel = idx===0 ? `<span class="lunch-label">${icon('utensils',12)} Ručak</span>` : "";
    const lunchTop = PAD_TOP+(LUNCH_START_MIN-GRID_START_MIN)*dayPxPerMin, lunchBot = PAD_TOP+(LUNCH_END_MIN-GRID_START_MIN)*dayPxPerMin;
    return `<div class="emp-col">
      <div class="col-head">
        <div class="name-row"><span class="col-dot" style="background:${emp.color}"></span>${escapeHtml(emp.name)}</div>
        <button class="btn btn-ghost ispis-btn" data-act="open-report" data-emp="${emp.id}">${icon('fileText',12)} Ispis tjedna</button>
      </div>
      <div class="emp-track ${weekend?"weekend":""}" style="height:${totalHeight}px;background-image:${gridBg}" data-emp="${emp.id}" data-date="${dateISO}">
        <div class="lunch-band" style="top:${lunchTop}px;height:${lunchBot-lunchTop}px">${lunchLabel}</div>
        ${hits}${blocks}
        ${showNow ? `<div class="now-line" style="top:${nowTop}px"></div>` : ""}
      </div>
    </div>`;
  }).join("");

  return `<div class="dayview-scroll"><div class="dayview-grid">
    <div class="time-col" style="height:${totalHeight+52}px"><div class="col-head"></div>${timeLabels}</div>
    ${empCols}
  </div></div>`;
}
function renderItemBlock(it, dayPxPerMin, padTop, isLastCol){
  const emp = state.employees.find(e=>e.id===it.employee_id);
  const startMin = timeToMinutes(it.start_time);
  const endMin = startMin + it.duration_minutes;
  const top = padTop + (startMin-GRID_START_MIN)*dayPxPerMin;
  const height = Math.max((endMin-startMin)*dayPxPerMin - 2, 24);
  let bg, border, color="#fff";
  if(it.item_type==="vacation"){ bg=VACATION_COLOR; border=VACATION_COLOR; color="#3A2600"; }
  else if(it.item_type==="internal_dev"){ bg=INTERNAL_DEV_COLOR; border=INTERNAL_DEV_COLOR; color="#4A3900"; }
  else { bg=emp?emp.color:"#999"; border=emp?emp.color:"#999"; color=getContrastText(bg); }
  const title = it.item_type==="task" ? (it.task_number||"Task") : TYPE_META[it.item_type].label;
  const endTime = minutesToTime(endMin);
  const sub = `${it.start_time.slice(0,5)}–${endTime}`;
  const hasNote = it.assigned_note && it.assigned_note.trim();

  const datesLine = hasDates ? [hasFV?`PV: ${fmtDateShort(hasFV)}`:"", hasDue?`Rok: ${fmtDateShort(hasDue)}`:""].filter(Boolean).join(" · ") : "";
  const showDatesInline = hasDates && it.duration_minutes>=60;
  const titleAttr = ` title="${escapeHtml(title+" · "+sub+(datesLine?"\n"+datesLine:"")+(hasNote?"\nBilješka: "+it.assigned_note:"")+(hasLink?"\nLink: "+it.task_link:""))}"`;
  const hasExtra = hasDates || hasFlags;
  const delBtn = `<span class="item-del" data-act="quick-delete-item" data-id="${it.id}" title="Obriši">${icon('trash',11)}</span>`;
  const doneBtn = `<span class="item-done-btn" data-act="toggle-done" data-id="${it.id}" title="${it.is_done?'Označi kao neodrađeno':'Označi kao odrađeno'}">${icon('check',11)}</span>`;

      ${hasNote ? `<span class="flag flag-note" title="Bilješka: ${escapeHtml(it.assigned_note)}">${icon('note',10)}</span>` : ""}
      ${hasLink ? `<a href="${escapeHtml(normalizeUrl(it.task_link))}" target="_blank" rel="noopener noreferrer" class="flag flag-link" title="${escapeHtml(it.task_link)}" onclick="event.stopPropagation()">${icon('link',10)} Link</a>` : ""}
    </div>` : ""}
    <div class="resize-handle" data-act="resize-handle" data-id="${it.id}"></div>
  </div>`;
}
function fmtDateShort(iso){
  const d = new Date(iso+"T00:00:00");
  return d.getDate()+"."+(d.getMonth()+1)+".";
}
function normalizeUrl(url){
  if(!url) return url;
  const t = url.trim();
  if(!t) return t;
  if(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(t)) return t; // already has a scheme (http, https, mailto...)
  return "https://" + t;
}
function hexA(hex,a){
  if(!hex) hex="#999999";
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
const DAILY_LIMIT_MIN = 420; // 7h
function effectiveWorkMinutes(startTime, durationMin){
  const start = timeToMinutes(startTime), end = start + durationMin;
  const overlap = Math.max(0, Math.min(end, LUNCH_END_MIN) - Math.max(start, LUNCH_START_MIN));
  return durationMin - overlap;
}
function employeeDayMinutes(empId, dateISO, excludeId){
  return state.items.filter(it=>it.employee_id===empId && it.item_date===dateISO && it.item_type!=="vacation" && it.id!==excludeId)
    .reduce((s,it)=>s+effectiveWorkMinutes(it.start_time, it.duration_minutes),0);
}
function employeeDayVacationMinutes(empId, dateISO){
  return state.items.filter(it=>it.employee_id===empId && it.item_date===dateISO && it.item_type==="vacation")
    .reduce((s,it)=>s+it.duration_minutes,0);
}
function employeeRangeCapacity(empId, startISO, endISO, items){
  let availableMin=0, vacationMin=0;
  let d = new Date(startISO+"T00:00:00");
  const endD = new Date(endISO+"T00:00:00");
  while(d<=endD){
    const dISO = fmtISO(d);
    if(!isWeekend(dISO) && !holidayName(dISO)){
      const dayVac = items.filter(it=>it.employee_id===empId && it.item_date===dISO && it.item_type==="vacation")
        .reduce((s,it)=>s+it.duration_minutes,0);
      availableMin += Math.max(0, DAILY_LIMIT_MIN - dayVac);
      vacationMin += Math.min(dayVac, DAILY_LIMIT_MIN); // vacation is measured in the same 7h/day unit as capacity — a whole-day off is exactly one day's worth (7h), never more
    }
    d = addDays(d,1);
  }
  return { availableMin, vacationMin };
}
function overloadBadgeHtml(empId, dateISO, size){
  const workMin = employeeDayMinutes(empId, dateISO);
  const vacMin = employeeDayVacationMinutes(empId, dateISO);
  const capacity = Math.max(0, DAILY_LIMIT_MIN - vacMin);
  if(workMin===0 && capacity===DAILY_LIMIT_MIN) return ""; // nothing booked, full capacity free — no need to clutter with "0%"
  const pct = capacity>0 ? Math.round(workMin/capacity*100) : (workMin>0 ? 999 : 0);
  const over = pct>100;
  const label = pct>=999 ? "—" : pct+"%";
  const cls = over ? "over" : (pct>=85 ? "high" : "");
  return `<span class="fill-badge ${cls} ${size==='sm'?'sm':''}" title="Rezervirano ${minutesToHM(workMin)} od ${minutesToHM(capacity)} dostupno${vacMin?` (${minutesToHM(Math.min(vacMin,DAILY_LIMIT_MIN))} godišnji)`:""} — ${label}">${label}</span>`;
}

   MULTI-DAY VIEW (employees as rows, dates as columns)

function renderMultiDayView(){
  const dates = getVisibleDates();

  }
  const slotPx = state.viewMode==="3day" ? state.settings.row_px_3day : state.settings.row_px_week; // px per 30-min row
  const boardHeight = 18*slotPx; // 9h / 30min = 18 rows
  const headCells = dates.map(dISO=>{
    const d = new Date(dISO+"T00:00:00");
    const hol = holidayName(dISO); const weekend = isWeekend(dISO);
    const muted = hol || weekend;
    const isToday = dISO===todayISO();
    return `<div class="mhead-cell ${muted?"muted":""} ${isToday?"today-col":""}">

    ${rows}
  </div></div>`;
}

/* =========================================================
   OVERVIEW VIEW — mjesecna popunjenost po zaposleniku (sati dostupno/rezervirano)
   ========================================================= */
function computeDayCapacity(empId, dateISO){
  const vacMinRaw = employeeDayVacationMinutes(empId, dateISO);
  const vacationMin = Math.min(vacMinRaw, DAILY_LIMIT_MIN);
  const availableMin = Math.max(0, DAILY_LIMIT_MIN - vacationMin);
  const bookedMin = employeeDayMinutes(empId, dateISO);
  return { availableMin, bookedMin, vacationMin };
}
function computeOverviewGrid(dates){
  const cols = []; const dateCol = {}; let idx=1;
  for(let i=0;i<dates.length;i+=7){
    const week = dates.slice(i,i+7);
    week.forEach(dISO=>{ cols.push("1fr"); dateCol[dISO]=idx; idx++; });
    if(i+7<dates.length){ cols.push("14px"); idx++; }
  }
  return { templateColumns: cols.join(" "), dateCol };
}
function renderOverviewView(){
  const activeEmps = sortPinnedFirst(state.employees.filter(e=>e.active));

  const todayISOStr = todayISO();

  const rowsHtml = visible.length ? visible.map(emp=>{
    const cells = dates.map(dISO=>{

          tip = `${minutesToHM(cap.bookedMin)} zauzeto od ${minutesToHM(cap.availableMin)} dostupno`+(cap.vacationMin>0?` (${minutesToHM(cap.vacationMin)} godišnji)`:"")+(over?" — PREPUNJENO":"");
        }

      <div class="ov-legend">

        <div class="ov-legend-item"><span class="ov-sw" style="background:var(--ov-over)"></span>Prepunjeno (!)</div>

      </div>
      <div class="ov-board">

function renderMiniBoard(emp, dISO, slotPx, boardHeight, rowBg, isLast, showAxis){
  const hol = holidayName(dISO); const weekend = isWeekend(dISO);
  const muted = hol || weekend;
  const isToday = dISO===todayISO();
  const cellBg = isToday ? (rowBg==="var(--row-bg-a)" ? "var(--row-today-a)" : "var(--row-today-b)") : muted ? (rowBg==="var(--row-bg-a)" ? "var(--row-muted-a)" : "var(--row-muted-b)") : rowBg;
  const pxPerMin = slotPx/30;
  const PAD = 8;
  const cellHeight = boardHeight + PAD*2;
  const items = state.items.filter(it=>it.employee_id===emp.id && it.item_date===dISO).sort((a,b)=>timeToMinutes(a.start_time)-timeToMinutes(b.start_time));
  const blocks = items.map(it=>renderMiniBlock(it, emp, pxPerMin, PAD, isLast)).join("");
  const lunchTop = PAD+(LUNCH_START_MIN-GRID_START_MIN)*pxPerMin, lunchBot = PAD+(LUNCH_END_MIN-GRID_START_MIN)*pxPerMin;
  let gridStops = [`transparent ${PAD}px`];
  DISPLAY_TIME_MARKS.forEach(t=>{
    const y = PAD+(timeToMinutes(t)-GRID_START_MIN)*pxPerMin;
    gridStops.push(`transparent ${y}px`, `var(--border) ${y}px`, `var(--border) ${y+1}px`, `transparent ${y+1}px`);
  });
  const gridBg = `linear-gradient(to bottom, ${gridStops.join(",")})`;
  const axisLabels = showAxis ? DISPLAY_TIME_MARKS.map(t=>`<div class="mb-axis-label ${t.endsWith(':00')?'hourmark':''}" style="top:${PAD+(timeToMinutes(t)-GRID_START_MIN)*pxPerMin+1}px">${t}</div>`).join("") + `<div class="mb-axis-label hourmark" style="top:${PAD+boardHeight-10}px">17:00</div>` : "";
  return `<div class="mcell ${muted?"muted":""} ${isLast?"mcell-last":""}" style="background:${cellBg}">
    <div class="mboard ${showAxis?'has-axis':''}" style="height:${cellHeight}px;background-image:${gridBg}" data-act="add-item-board" data-emp="${emp.id}" data-date="${dISO}" data-slotpx="${slotPx}" data-pad="${PAD}">
      <div class="mb-lunch" style="top:${lunchTop}px;height:${lunchBot-lunchTop}px"></div>
      ${axisLabels}
      ${blocks}
    </div>
  </div>`;
}

async function unlockSettings(){
  const input = document.getElementById("settingsPwInput");
  const pw = input.value;
  if(!pw) return;
  state.settingsBusy = true; state.settingsError = null; render();
  try{
    const rows = await sb("/app_config?select=value&key=eq.settings_password_hash");
    const hash = rows && rows[0] ? rows[0].value : null;
    const entered = await sha256hex(pw);
    if(!hash || entered!==hash){
      state.settingsBusy=false; state.settingsError="Neispravna lozinka."; render(); return;
    }
    state.settingsUnlocked = true; state.settingsBusy=false;
    render();
  }catch(e){ state.settingsBusy=false; state.settingsError="Greška: "+e.message; render(); }

function handleSoundFileSelected(file){
  if(!file) return;
  if(!file.type.startsWith("audio/")){ showToast("Odaberi audio fajl (mp3, wav i sl.)."); return; }
  if(file.size > 3*1024*1024){ showToast("Fajl je prevelik (max 3MB)."); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    state.newSoundFile = { name:file.name, dataUrl:reader.result };

function fmtDateHR(iso){
  if(!iso) return null;
  const d = new Date(iso+"T00:00:00");
  return d.getDate()+". "+MONTHS_HR[d.getMonth()]+" "+d.getFullYear()+".";
}
function occupiedIntervals(employeeId, dateISO, excludeId, includeLunch){
  const real = state.items.filter(it=>it.employee_id===employeeId && it.item_date===dateISO && it.id!==excludeId)
    .map(it=>({start:timeToMinutes(it.start_time), end:timeToMinutes(it.start_time)+it.duration_minutes}));
  if(includeLunch) real.push({start:LUNCH_START_MIN, end:LUNCH_END_MIN}); // lunch blocks START times, but not duration span
  return real.sort((a,b)=>a.start-b.start);
}
function isTimeOccupied(intervals, minute){
  return intervals.some(iv=>minute>=iv.start && minute<iv.end);
}
function isLunchTime(minute){ return minute>=LUNCH_START_MIN && minute<LUNCH_END_MIN; }
function nextOccupiedStart(intervals, minute){
  const upcoming = intervals.filter(iv=>iv.start>minute).map(iv=>iv.start);
  return upcoming.length ? Math.min(...upcoming) : GRID_END_MIN;
}
function pickFirstFreeStart(intervals, preferred){
  if(!isTimeOccupied(intervals, timeToMinutes(preferred))) return preferred;
  for(const t of TIME_SLOTS){ if(!isTimeOccupied(intervals, timeToMinutes(t))) return t; }
  return preferred;
}
function startTimeOptionsHtml(d, intervals){
  return TIME_SLOTS.map(t=>{
    const mins = timeToMinutes(t);
    const occupied = t!==d.start_time && isTimeOccupied(intervals, mins);
    const label = occupied ? (isLunchTime(mins) ? " — pauza" : " — zauzeto") : "";
    return `<option value="${t}" ${t===d.start_time?"selected":""} ${occupied?"disabled":""}>${t}${label}</option>`;
  }).join("");
}
const DAILY_CAP_MIN = 420; // 7h standardni radni dan
function durationOptionsHtml(d, dailyRemainingMin){
  const startMin = timeToMinutes(d.start_time);
  const maxDur = Math.max(SLOT_MIN, Math.min(dailyRemainingMin, GRID_END_MIN - startMin));
  const all = []; for(let m=SLOT_MIN;m<=maxDur;m+=SLOT_MIN) all.push(m);
  if(!all.length) all.push(SLOT_MIN);
  if(d.duration_minutes>maxDur) d.duration_minutes = all[all.length-1];
  return all.map(m=>`<option value="${m}" ${m===d.duration_minutes?"selected":""}>${minutesToHM(m)}</option>`).join("");
}
// Opcenita razdioba oko SVIH postojecih zauzeca (pauza za rucak + drugi taskovi) - cuva ukupno trazeno
// trajanje (produzuje dalje ako naidje na prepreku), umjesto da skracuje ili blokira unos. Vraca null
// ako nema preklapanja (sprema se kao jedna stavka kao i do sad).
function computeSplitAroundOccupied(itemType, startTime, durationMinutes, employeeId, dateISO, excludeId){
  const isTaskLike = (itemType==="task" || itemType==="internal_dev");
  if(!isTaskLike) return null;
  const occupied = occupiedIntervals(employeeId, dateISO, excludeId, true);
  const startMin = timeToMinutes(startTime);
  let cursor = startMin, remaining = durationMinutes;
  const segments = [];
  const relevant = occupied.filter(iv=>iv.end>startMin).sort((a,b)=>a.start-b.start);
  for(const iv of relevant){
    if(remaining<=0) break;
    if(iv.start > cursor){
      const freeLen = Math.min(iv.start-cursor, remaining);
      if(freeLen>0){ segments.push({start_time:minutesToTime(cursor), duration_minutes:freeLen}); remaining -= freeLen; }
    }
    cursor = Math.max(cursor, iv.end);
  }
  if(remaining>0){
    const cap = Math.max(0, GRID_END_MIN - cursor);
    const finalLen = Math.min(remaining, cap);
    if(finalLen>0){ segments.push({start_time:minutesToTime(cursor), duration_minutes:finalLen}); remaining -= finalLen; }
  }
  if(segments.length===0) return null; // rubni slucaj - nije bilo moguce nista smjestiti
  if(segments.length===1 && segments[0].start_time===startTime && segments[0].duration_minutes===durationMinutes) return null; // bez promjene
  return segments;
}

function renderDatePickerPopup(){
  const dp = state.datePicker;
  const firstOfMonth = new Date(dp.year, dp.month-1, 1);
  const startOffset = (firstOfMonth.getDay()+6)%7;
  const daysInMonth = new Date(dp.year, dp.month, 0).getDate();
  const totalCells = Math.ceil((startOffset+daysInMonth)/7)*7;
  const selected = state.itemModal.data[dp.field];
  let cells = "";
  for(let i=0;i<totalCells;i++){
    const dayNum = i - startOffset + 1;
    if(dayNum<1 || dayNum>daysInMonth){ cells += `<button class="dp-day empty"></button>`; continue; }
    const dISO = dp.year+"-"+String(dp.month).padStart(2,"0")+"-"+String(dayNum).padStart(2,"0");
    const isSel = dISO===selected, isToday = dISO===todayISO();
    cells += `<button class="dp-day ${isSel?"sel":""} ${isToday?"today":""}" data-act="pick-date" data-date="${dISO}">${dayNum}</button>`;
  }
  return `<div class="overlay top" data-act="close-datepicker">

/* =========================================================
   PDF EXPORT — native jsPDF (bez html2canvas/canvas snimanja)
   Generira se izravno tekstom/tablicama pomoću jsPDF-a, bez fotografiranja
   DOM-a u canvas. Ovo zaobilazi sve poznate html2canvas probleme (cloned
   iframe, corrupt PNG, prazan canvas) jer canvas uopće nije uključen -
   PDF je pravi tekst, pretraživ, i identično radi u svakom browseru.
   ========================================================= */
// jsPDF-ovi ugradjeni fontovi (helvetica i sl.) NE podrzavaju hrvatska slova c/c/s/dj/z (nisu dio
// WinAnsi kodiranja), pa bi se inace krivo prikazala/izgubila u PDF-u. Dok ne ugradimo poseban font,
// najpouzdanije rjesenje je zamijeniti ih ASCII inacicama - citljivo, bez artefakata.
function pdfSafe(str){
  if(str==null) return "";
  const map = {"č":"c","ć":"c","š":"s","đ":"dj","ž":"z","Č":"C","Ć":"C","Š":"S","Đ":"Dj","Ž":"Z"};
  return String(str).replace(/[čćšđžČĆŠĐŽ]/g, ch=>map[ch]||ch);
}
function pdfHeader(pdf, marginL, pageW, title, subtitle){
  pdf.setFont("helvetica","bold"); pdf.setFontSize(9);
  pdf.setTextColor(0,130,47);
  pdf.text("RASPORED - DIZAJN TIM", marginL, 15);
  pdf.setDrawColor(0,160,59); pdf.setLineWidth(0.4);
  pdf.line(marginL, 18, pageW-marginL, 18);
  pdf.setTextColor(30,30,30);
  pdf.setFont("helvetica","bold"); pdf.setFontSize(15);
  pdf.text(pdfSafe(title), marginL, 28);
  pdf.setFont("helvetica","normal"); pdf.setFontSize(10);
  pdf.setTextColor(120,120,120);
  pdf.text(pdfSafe(subtitle), marginL, 34);
  pdf.setTextColor(30,30,30);
  return 42;
}
function pdfFooter(pdf, marginL, pageW, pageH){
  const pages = pdf.internal.getNumberOfPages();
  for(let i=1;i<=pages;i++){
    pdf.setPage(i);
    pdf.setDrawColor(225,227,231); pdf.setLineWidth(0.2);
    pdf.line(marginL, pageH-14, pageW-marginL, pageH-14);
    pdf.setFont("helvetica","normal"); pdf.setFontSize(8);
    pdf.setTextColor(150,150,150);
    pdf.text(pdfSafe("Generirano "+new Date().toLocaleDateString("hr-HR")), marginL, pageH-9);
    pdf.text(String(i)+" / "+pages, pageW-marginL, pageH-9, {align:"right"});
    pdf.setTextColor(30,30,30);
  }
}
// jednostavan tablični crtač (bez vanjskog autoTable plugina)
function pdfTable(pdf, opts){
  const pageH = opts.pageH, marginB = 20, rowH = opts.rowH||7;
  let y = opts.y;
  const totalW = opts.colWidths.reduce((a,b)=>a+b,0);
  function newPageIfNeeded(need){
    if(y+need > pageH-marginB){ pdf.addPage(); y = 20; return true; }
    return false;
  }
  newPageIfNeeded(rowH+2);
  pdf.setFillColor(244,245,247);
  pdf.rect(opts.x, y-5, totalW, rowH, "F");
  pdf.setFont("helvetica","bold"); pdf.setFontSize(9); pdf.setTextColor(70,70,70);
  let cx = opts.x;
  opts.header.forEach((h,i)=>{
    const align = (opts.colAligns&&opts.colAligns[i])||"left";
    pdf.text(pdfSafe(h), align==="right"?cx+opts.colWidths[i]-2:cx+2, y, {align:align==="right"?"right":"left"});
    cx += opts.colWidths[i];
  });
  y += rowH;
  pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(40,40,40);
  opts.rows.forEach((row,idx)=>{
    newPageIfNeeded(rowH);
    if(row._bold){ pdf.setFont("helvetica","bold"); pdf.setDrawColor(210,212,218); pdf.setLineWidth(0.3); pdf.line(opts.x,y-5,opts.x+totalW,y-5); }
    else if(idx%2===1){ pdf.setFillColor(250,250,251); pdf.rect(opts.x,y-5,totalW,rowH,"F"); }
    let cx2 = opts.x;
    row.forEach((cell,i)=>{
      const align = (opts.colAligns&&opts.colAligns[i])||"left";
      pdf.text(pdfSafe(cell), align==="right"?cx2+opts.colWidths[i]-2:cx2+2, y, {align:align==="right"?"right":"left"});
      cx2 += opts.colWidths[i];
    });
    if(row._bold) pdf.setFont("helvetica","normal");
    y += rowH;
  });
  return y;
}

function buildWeeklyReportPdf(filenameBase){
  const st = state.reportModal;
  const emp = state.employees.find(e=>e.id===st.employeeId);
  const taskMap = {}; let internalMin=0, vacationMin=0;
  st.items.forEach(it=>{
    if(it.item_type==="task"){ const key=it.task_number||"(bez broja)"; taskMap[key]=(taskMap[key]||0)+it.duration_minutes; }
    else if(it.item_type==="internal_dev"){ internalMin+=it.duration_minutes; }
    else if(it.item_type==="vacation"){ vacationMin+=it.duration_minutes; }
  });
  const taskRows = Object.entries(taskMap).sort((a,b)=>b[1]-a[1]);
  const workedTotal = taskRows.reduce((s,[,m])=>s+m,0) + internalMin;
  const dailyItems = [...st.items].sort((a,b)=> a.item_date.localeCompare(b.item_date) || a.start_time.localeCompare(b.start_time));

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");
  const pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight();
  const marginL = 15;
  let y = pdfHeader(pdf, marginL, pageW, "Tjedni izvještaj — "+(emp?emp.name:""), st.weekStart+" — "+st.weekEnd);

  const taskTableRows = taskRows.length ? taskRows.map(([k,m])=>[k, minutesToHM(m)]) : [["Nema taskova ovaj tjedan",""]];
