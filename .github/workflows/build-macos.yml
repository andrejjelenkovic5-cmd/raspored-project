name: Build Desktop App (macOS + Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos
          - platform: windows-latest
            label: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Postavi Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instaliraj npm ovisnosti
        working-directory: desktop
        run: npm install

      - name: Izgradi aplikaciju
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop

      - name: Prilozi gotovu app kao download
        uses: actions/upload-artifact@v4
        with:
          name: raspored-desktop-${{ matrix.label }}
          if-no-files-found: ignore
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
